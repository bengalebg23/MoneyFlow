<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════════════
  MONEY FLOW — HANDOFF NOTES (read this first in any new Claude chat)
  ═══════════════════════════════════════════════════════════════════════

  WHAT THIS IS
  A single-file PWA that draws a Sankey diagram per year of the household
  joint account (Santander), in the style of the r/FIREUK SankeyMATIC posts:
  income sources → household pot → spending categories → individual items.
  Data comes from the "Santander" sheet of Ben's "2026 Finances" workbook.
  Intended repo: bengalebg23/MoneyFlow, served via GitHub Pages at
  bengalebg23.github.io/MoneyFlow/.

  ARCHITECTURE
  - Single index.html, vanilla JS, no build step. Same pattern and look as
    MealRota (Inter + IBM Plex Mono + Patrick Hand, #F7F8FA ground).
  - d3 7.9.0 + d3-sankey 0.12.3 draw the chart; SheetJS 0.18.5 reads the xlsx.
  - BUILTIN_DATA = figures taken from "2026 finances 5 -AI.xlsx" (3 Oct 2026).
    2026 is Jan–Jun only (sheet ran to early June). 2026 splits Emily's
    £13,123 April one-off (driveway money) from her regular £750/month.
  - "Load spreadsheet" re-reads the Santander sheet in the browser and
    replaces the built-in figures (kept in localStorage, STORE_KEY).
    Parser rules (parseSantander):
      · year blocks = each "Dec" in the month header row, 12 cols Dec→Jan;
        block year = the number above its BUDGET column (block+13), else above
        the block. (The sheet's top-left block is labelled 2025 but is 2026.)
      · a block with ≥10 months of mortgage is summed month by month; older
        partial blocks use the annual TOTAL column at block−5.
      · sections come from col A headers (income, Baseline, Food, variable,
        Bills, Savings, House, Parties, Holiday, Annual payments); items from
        col B. "Total"/blank rows and zero/negative items are skipped.
      · older years (annual mode) take Ben/Emily from their Total rows, and a
        category falls back to its single total when its items don't add up
        to within 10% (the 2024 food items hold monthly averages).
  - Nothing is synced; localStorage only. No Firebase needed.

  CHANGELOG
  v1.5.1 — Year comparison labels get a small ▲/▼ % against the year before
           (red = spent more, green = spent less; "new" if absent last year).
  v1.5.0 — One-off vs ongoing logic (isOneOff). Part years only pro-rate ongoing
           costs; one-off costs show as spent so far. One-off = category in
           ONE_OFF_CATS (Holidays, Home projects, Parties & weddings, Annual
           payments), a seasonal item in ONE_OFF_ITEMS (Christmas, birthdays…),
           or a lumpy spending pattern: with ≥4 months of data, spend landed in
           ≤ max(1, months/4) months or ≥60% of it in one month. The parser
           stores those as years[y].lumpy; BUILTIN_DATA carries the same flags
           worked out from the 2025/2026 monthly columns.
  v1.4.0 — Year comparison now puts the years side by side (one column each,
           chart-box height, shared £→px scale) with the labels listed
           underneath each chart instead of on it. Items get one fixed colour
           each across all years (7 biggest + highlighted; rest fold to Other).
  v1.3.0 — Tapping a flow now opens a full-screen visual comparison: one panel
           per year, each the size of the main chart, showing the tapped
           category flowing into its items (or income sources into the pot when
           the pot is tapped). Every panel uses one shared £→px scale so sizes
           compare directly; part years are pro-rated to a full year (×12/months)
           and labelled ≈. Tapping an item opens its category with that item
           highlighted. Items keep one order across all years.
  v1.2.0 — Whole chart (all four columns, items included) is laid out on a
           canvas ~2.3× the phone width with natural proportions and opens zoomed
           out to fit it all (k0), like the SankeyMATIC original. Every label is a
           small boxed tag at a fixed screen size; biggest flows claim space
           first, so item labels appear as you zoom in. Smaller text (10.5/11px,
           amounts 9.5px). Removed the DETAIL_K show/hide threshold.
  v1.1.0 — Chart is now pinch/scroll zoomable and draggable (d3.zoom), with
           +/−/reset buttons. The item column is always laid out but only
           shown once zoom ≥ DETAIL_K (1.7); labels keep a fixed screen size and
           the biggest flows claim label space first, so more labels appear as
           you zoom. Tapping any band, node or table row opens a bottom-sheet
           comparing that line across all years on a full-year basis: part
           years are pro-rated from their monthly average (value / months × 12).
           Removed the "Show item breakdown" checkbox (zoom replaces it).
  v1.0.0 — First version. Year tabs (2024 / 2025 / 2026 YTD), totals strip,
           Sankey with optional item breakdown, sortable-by-size breakdown
           table, xlsx import with reset to built-in figures.
  ═══════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F8FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Money Flow v1.5.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#EEF1F5; --line:#D7DCE3;
    --paper:#26313F; --paper-dim:#5b6b7d; --muted:#6b7a8c;
    --mustard:#2F6FE4; --mustard-dim:#1f4fb0; --rose:#F0703C; --today:#2FA84F;
    --c-home:#2a78d6; --c-food:#eb6834; --c-spend:#1baf7a; --c-kids:#e87ba4;
    --c-trips:#eda100; --c-annual:#4a3aa7; --c-in:#8a97a8; --c-top:#0ea5b7; --c-gap:#e34948; --c-left:#2FA84F;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--paper); font-family:'Inter',system-ui,sans-serif; min-height:100vh; padding-bottom:48px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }
  .display{font-family:'Patrick Hand',cursive;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  header.top{
    padding:calc(14px + env(safe-area-inset-top,0px)) 18px 10px;
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 80%, transparent); backdrop-filter:blur(6px);
  }
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 2px;}
  h1.title{font-size:28px; margin:0; font-weight:400;}
  .title-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 9px;}
  .version-badge{flex:none; font-size:11px; font-weight:600; color:var(--mustard); background:var(--surface); border:1px solid var(--mustard-dim); padding:4px 9px; border-radius:20px;}
  .year-tabs{display:flex; gap:5px;}
  .yr-tab{
    flex:1; text-align:center; padding:6px 0 5px; border-radius:9px; background:var(--surface); border:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--paper-dim); cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .src-tabs{display:flex; gap:6px; margin:0 0 8px;}
  .src-tab{border:1px solid var(--line); background:var(--surface); color:var(--paper-dim); border-radius:999px; padding:5px 12px; font:600 12px 'Inter',sans-serif; cursor:pointer;}
  .src-tab.active{background:var(--paper); color:#fff; border-color:var(--paper);}
  .year-tabs.many{overflow-x:auto; padding-bottom:3px; -webkit-overflow-scrolling:touch;} .year-tabs.many .yr-tab{flex:none; min-width:58px;}
  #tie h2{margin:0 0 8px;} #tie .tie-note{font-size:12px; color:var(--paper-dim); margin:0 0 8px;}
  #tie td.ok{color:var(--today); font-weight:600;} #tie td.warn{color:var(--c-gap); font-weight:600;}
  .yr-tab .sub{display:block; font-family:'Inter',sans-serif; font-size:8px; font-weight:500; letter-spacing:.06em; margin-top:1px; opacity:.7; text-transform:uppercase;}
  .yr-tab.active{background:var(--mustard); color:#fff; border-color:var(--mustard);}
  .yr-tab:focus-visible, button:focus-visible, label.chk:focus-within{outline:2px solid var(--mustard); outline-offset:2px;}

  main{max-width:1180px; margin:0 auto; padding:16px 18px 0; display:grid; gap:16px;}
  main > *{min-width:0;} .top > *{min-width:0; max-width:100%;}
  .ys-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;} .ys-wrap{min-width:0;} .cmp-body{grid-template-columns:minmax(0,1fr);}
  .stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px;}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; display:grid; gap:2px; min-width:0;}
  .stat .k{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}
  .stat .v{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:clamp(17px,4.4vw,26px); font-variant-numeric:tabular-nums;}
  .stat .s{font-size:12px; color:var(--paper-dim);}
  .neg{color:var(--c-gap);} .pos{color:var(--today);}

  .bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between;}
  label.chk{display:inline-flex; gap:7px; align-items:center; font-size:13px; color:var(--paper-dim); cursor:pointer; border-radius:8px;}
  label.chk input{accent-color:var(--mustard); width:16px; height:16px;}
  .btn{font:inherit; font-size:13px; font-weight:600; padding:7px 12px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--paper); cursor:pointer;}
  .btn.primary{background:var(--mustard); border-color:var(--mustard); color:#fff;}
  .btns{display:flex; gap:6px; flex-wrap:wrap;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:10px 0; position:relative;}
  .scroller{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  svg{display:block;}
  .nlabel{font-size:10.5px; fill:var(--paper); font-family:'Inter',sans-serif;}
  .nlabel .amt{fill:var(--paper-dim); font-family:'IBM Plex Mono',monospace; font-size:9.5px;}
  .nlabel.big{font-weight:600; font-size:11px;}
  .link{fill:none; stroke-opacity:.38; transition:stroke-opacity .15s;}
  .link:hover{stroke-opacity:.72;}
  .legend{display:flex; flex-wrap:wrap; gap:6px 14px; padding:6px 14px 0; font-size:12px; color:var(--paper-dim);}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .legend i{width:10px; height:10px; border-radius:3px; display:inline-block;}
  .note{font-size:12px; color:var(--muted); margin:6px 14px 0;}
  .src{font-size:12px; color:var(--muted); margin:0;}
  .tip{position:fixed; pointer-events:none; background:var(--paper); color:#fff; font-size:12.5px; padding:6px 10px; border-radius:8px; max-width:260px; z-index:30;}
  .tip b{font-family:'IBM Plex Mono',monospace;}

  .chart-box{position:relative; height:min(72vh, 620px); min-height:380px; overflow:hidden; touch-action:none; cursor:grab;}
  .chart-box:active{cursor:grabbing;}
  .chart-box svg{width:100%; height:100%; user-select:none; -webkit-user-select:none;}
  .nrect{cursor:pointer;} .link{cursor:pointer;}
  .lab-bg{fill:var(--surface); fill-opacity:.9; stroke:var(--line);}
  .zbtns{position:absolute; top:8px; right:8px; display:flex; flex-direction:column; gap:4px;}
  .zb{width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--paper); font:600 17px 'Inter',sans-serif; cursor:pointer; box-shadow:0 1px 3px rgba(38,49,63,.08);}
  .cmp{position:fixed; inset:0; z-index:60; background:var(--bg); overflow:auto; -webkit-overflow-scrolling:touch;}
  .cmp-head{position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:calc(12px + env(safe-area-inset-top,0px)) 18px 10px; background:var(--bg); border-bottom:1px solid var(--line);}
  .cmp-head h3{margin:0; font-size:26px; font-weight:400; line-height:1.1;}
  .cmp-sub{margin:2px 0 0; font-size:12px; color:var(--paper-dim);}
  .cmp-grid{animation:cmpIn .28s ease both;}
  @keyframes cmpIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  .c-list li.pick{cursor:pointer; border-radius:6px;} .c-list li.pick:hover, .c-list li.pick:focus-visible{background:var(--surface-2); outline:none;}
  .ys-wrap{animation:cmpIn .28s ease both; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 8px 6px;}
  .ys-svg{display:block; width:100%; overflow:visible;}
  .ys-svg .seg, .ys-svg .rib{cursor:pointer; transition:opacity .15s;}
  .ys-svg.dimming .seg:not(.on), .ys-svg.dimming .rib:not(.on){opacity:.12;}
  .ys-tbl tr.pinned td{font-weight:700;} .ys-tbl tr.pinned td:first-child::after{content:' ▲'; font-size:9px; color:var(--paper-dim);}
  .blab text{font-family:'Inter',sans-serif; fill:var(--paper); paint-order:stroke; stroke:var(--bg); stroke-width:2.5px; stroke-linejoin:round;}
  .blab .bl-n{font-size:9.5px; font-weight:600;} .blab .bl-a{font-family:'IBM Plex Mono',monospace; font-size:9px; fill:var(--paper-dim);}
  .ys-svg text{font-family:'IBM Plex Mono',monospace; fill:var(--paper-dim);}
  .ys-svg .yl{font-size:12px; font-weight:600; fill:var(--paper);} .ys-svg .yl.me{fill:var(--mustard);}
  .ys-svg .tl{font-size:10px;}
  .ys-svg .inl{font-size:9px; fill:var(--c-top);}
  .ys-tbl{width:100%; border-collapse:collapse; margin-top:10px; font-size:11px;}
  .ys-tbl th{font:600 10.5px 'IBM Plex Mono',monospace; color:var(--muted); text-align:right; padding:3px 4px; border-bottom:1px solid var(--line);} .ys-tbl th:first-child{text-align:left;}
  .ys-tbl td{padding:5px 4px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:10.5px; white-space:nowrap;}
  .ys-tbl td:first-child{text-align:left; font-family:'Inter',sans-serif; font-size:11.5px; white-space:normal;}
  .ys-tbl tr.r{cursor:pointer;} .ys-tbl tr.r:hover, .ys-tbl tr.r.on{background:var(--surface-2);}
  .ys-tbl i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:6px;}
  .linkbtn{background:none; border:0; padding:0; font:inherit; color:var(--c-home); text-decoration:underline; text-underline-offset:2px; cursor:pointer;}
  .cmp-body{max-width:1180px; margin:0 auto; padding:12px 10px calc(28px + env(safe-area-inset-bottom,0px)); display:grid; gap:14px;}
  .cmp-grid{display:grid; column-gap:6px; grid-template-rows:auto auto;}
  .col{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:8px 6px; display:grid; grid-row:span 2; grid-template-rows:subgrid; row-gap:8px; min-width:0;}
  .c-body{display:grid; gap:8px; align-content:start; min-width:0;}
  .col.me{border-color:var(--mustard); box-shadow:0 0 0 1px var(--mustard);}
  .c-head{display:grid; gap:1px; min-width:0;}
  .c-yr{font-size:16px; font-weight:600;}
  .c-now{justify-self:start; font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:#fff; background:var(--mustard); padding:1px 5px; border-radius:4px; font-weight:700;}
  .c-sub{font-size:10.5px; color:var(--muted);}
  .c-amt{font-size:14px; font-weight:600;}
  .c-delta{font-size:10.5px; color:var(--paper-dim); min-height:1.3em;}
  .c-delta .good{color:var(--today); font-weight:600;} .c-delta .bad{color:var(--c-gap); font-weight:600;}
  .c-svg{display:block; width:100%;}
  .c-empty{padding:20px 0; font-size:11px; color:var(--muted); text-align:center;}
  .c-list{list-style:none; margin:0; padding:0; display:grid; gap:4px;}
  .c-list li{display:grid; grid-template-columns:8px minmax(0,1fr); column-gap:5px; font-size:11px; line-height:1.25;}
  .c-list li i{width:8px; height:8px; border-radius:2px; margin-top:3px; grid-row:span 2;}
  .c-list .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .c-list .am{font-size:10px; color:var(--paper-dim);}
  .c-list li.hl .nm, .c-list li.hl .am{font-weight:700; color:var(--paper);}
  .c-list .ch{font-family:'Inter',sans-serif; font-size:8.5px; font-weight:700; margin-left:2px; white-space:nowrap;}
  .c-list .ch.bad{color:var(--c-gap);} .c-list .ch.good{color:var(--today);} .c-list .ch.new, .c-list .ch.flat{color:var(--muted); font-weight:600;}
  .c-list li.none{display:block; color:var(--muted); font-size:10.5px;}
  .scrim{position:fixed; inset:0; background:rgba(38,49,63,.35); z-index:50;}
  .sheet{position:fixed; left:50%; bottom:0; transform:translateX(-50%); width:min(560px,100%); max-height:82vh; overflow:auto; background:var(--surface); border-radius:18px 18px 0 0; padding:16px 18px calc(20px + env(safe-area-inset-bottom,0px)); z-index:51; box-shadow:0 -8px 30px rgba(38,49,63,.18); display:grid; gap:12px;}
  .sheet-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .sheet h3{margin:0; font-size:26px; font-weight:400; line-height:1.1;}
  .x{border:1px solid var(--line); background:var(--surface-2); border-radius:9px; width:32px; height:32px; cursor:pointer; color:var(--paper); font-size:14px; flex:none;}
  .sheet-main{display:flex; flex-wrap:wrap; gap:8px 22px;}
  .sheet-main > div{display:grid;}
  .sheet-main .k{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}
  .sheet-main .big{font-size:20px; font-weight:600;}
  .sheet-sub, .sheet-note{margin:0; font-size:12.5px; color:var(--paper-dim);}
  .yrs{display:grid; gap:12px;}
  .yr{display:grid; gap:4px; padding:8px 10px; border-radius:10px; border:1px solid var(--surface-2);}
  .yr.me{border-color:var(--mustard); background:var(--surface-2);}
  .yr-top, .yr-bot{display:flex; justify-content:space-between; gap:10px; font-size:13.5px; flex-wrap:wrap;}
  .yr-top small, .yl small{font-size:10.5px; color:var(--muted);}
  .yl{font-weight:600;}
  .yr-bot{font-size:12px; color:var(--paper-dim);}
  .track{height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
  .fill{height:100%; border-radius:4px;}
  .fill.part{background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.45) 0 3px, transparent 3px 7px);}
  .dl.good{color:var(--today); font-weight:600;} .dl.bad{color:var(--c-gap); font-weight:600;}
  .chev{border:0; background:none; color:var(--muted); font-size:12px; width:20px; padding:0; cursor:pointer;}
  .chev-sp{display:inline-block; width:20px;}
  tr.row{cursor:pointer;} tr.row:hover td{background:var(--surface-2);}
  h2{font-family:'Patrick Hand',cursive; font-weight:400; font-size:24px; margin:4px 0 0;}
  .tbl-wrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);}
  table{border-collapse:collapse; width:100%; font-size:13.5px;}
  th,td{padding:8px 12px; text-align:right; border-bottom:1px solid var(--surface-2);}
  td:not(:first-child){font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  th:first-child,td:first-child{text-align:left;}
  th{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.12em; font-weight:600;}
  td .sw{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:8px; vertical-align:middle;}
  tr.cat{cursor:pointer;} tr.cat td:first-child::after{content:" ▸"; color:var(--muted); font-size:11px;}
  tr.cat.open td:first-child::after{content:" ▾";}
  tr.sub td{color:var(--paper-dim); font-size:12.5px; padding-block:4px;}
  tr.sub td:first-child{padding-left:30px;}
  tfoot td{font-weight:600;}

  .sub-tabs{margin-top:-2px;}
  .sub-tab{border:0; background:transparent; color:var(--paper-dim); padding:4px 10px; font:600 12px 'Inter',sans-serif; cursor:pointer; border-bottom:2px solid transparent;}
  .sub-tab.active{color:var(--paper); border-bottom-color:var(--paper);}
  .w-card{padding:12px;} .w-head{display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; justify-content:space-between; margin-bottom:6px; font-size:12px;}
  .chk{display:inline-flex; gap:6px; align-items:center; cursor:pointer;}
  .w-key{display:flex; flex-wrap:wrap; gap:4px 12px; color:var(--paper-dim);} .w-key span{display:inline-flex; align-items:center; gap:5px;}
  .w-key i{width:10px; height:10px; border-radius:2px; display:inline-block;} .w-key i.ln{height:0; width:14px; border-top:2px solid var(--paper); border-radius:0;} .w-key i.dash{border-top-style:dashed;}
  #wSvg{display:block; width:100%; max-width:100%;} .ax{font:10px 'Inter',sans-serif; fill:var(--paper-dim);}
  .w-read{margin-top:8px; font-size:13px;} .w-read .r-top{display:flex; justify-content:space-between; margin-bottom:4px;}
  .w-read .r-grid{display:grid; grid-template-columns:1fr auto; gap:2px 14px;} .w-read .r-grid span{display:inline-flex; align-items:center; gap:6px;} .w-read i{width:9px; height:9px; border-radius:2px; display:inline-block;}

      const freq = {}; months.forEach(cells => new Set(cells.filter(x=>x>=500)).forEach(x => freq[x] = (freq[x]||0)+1));
      const top1 = Object.entries(freq).sort((p,q)=>q[1]-p[1] || q[0]-p[0])[0];
      if(!top1) continue;
      const usual = Object.keys(freq).map(Number).filter(x => freq[x] >= 2 && x >= +top1[0]/2);
      let reg = 0;
      for(const cells of months){
        const hit = usual.filter(x => cells.includes(x));
        const sum = cells.reduce((a,c)=>a+c,0);
        const pick = hit.length ? Math.max(...hit) : Math.max(0, ...usual.filter(x => x <= sum));
        reg += pick;
      }
      reg = Math.min(reg, inc[who]);
      const top = inc[who] - reg; delete inc[who];
      inc[who+' (regular)'] = reg; if(top > 0) inc[who+' (top-ups)'] = top;
    }
    for(const k of Object.keys(inc)) if(inc[k] <= 0) delete inc[k];
    if(!out.Mortgage && !Object.keys(inc).length) continue;
    years[y] = {months: useAnnual ? 12 : Math.max(lastM,1), income:inc, out, lumpy, note:''};
  }
  if(!Object.keys(years).length) throw new Error('No year blocks with figures were found.');
  return years;
}

// ── sankey ──
function build(d){
  const nodes = [], links = [], idx = {};
  const node = (key, color, col, ref) => { if(!(key in idx)){ idx[key]=nodes.length; nodes.push({key,name:clean(key),color,col,ref}); } return idx[key]; };
  const inTot = Object.values(d.income).reduce((a,b)=>a+b,0);
  const outTot = Object.values(d.out).reduce((a,v)=>a+total(v),0);
  const hub = node("Household pot", css("--paper-dim"), 1, {t:'hub'});
  const inColor = k => /top-ups/.test(k) ? css("--c-top") : css("--c-in");
  for (const [k,v] of Object.entries(d.income).sort((a,b)=>b[1]-a[1])) links.push({source:node(k,inColor(k),0,{t:'in',name:k}),target:hub,value:v,color:inColor(k)});
  if (outTot > inTot) links.push({source:node("Drawn from balance",css("--c-gap"),0,{t:'gap'}),target:hub,value:outTot-inTot,color:css("--c-gap")});
  for (const [cat,v] of Object.entries(d.out).sort((a,b)=>total(b[1])-total(a[1]))){
    if (total(v) <= 0) continue;
    const c = famColor(CATS[cat] || 'home'), ci = node(cat, c, 2, {t:'cat',cat});
    links.push({source:hub,target:ci,value:total(v),color:c});
    if (typeof v === "object" && Object.keys(v).length > 1){
      const tot = total(v); let other = 0, shown = 0;
      for (const [k,val] of Object.entries(v).sort((a,b)=>b[1]-a[1])){
        if (val <= 0) continue;
        if (shown < 8 && val/tot >= 0.03) { links.push({source:ci,target:node(cat+"›"+k,c,3,{t:'item',cat,item:k}),value:val,color:c}); shown++; }
        else other += val;
      }
      if (other > 0) links.push({source:ci,target:node(cat+"›Other",c,3,{t:'other',cat}),value:other,color:c});
    }
  }
  if (inTot > outTot) links.push({source:hub,target:node("Left over",css("--c-left"),2,{t:'left'}),value:inTot-outTot,color:css("--c-left")});
  return {nodes,links,inTot,outTot};
}
function clean(n){ return n.includes("›") ? n.split("›")[1] : n; }

const tip = document.getElementById("tip");
function showTip(ev, html){ if(ev.pointerType && ev.pointerType!=='mouse') return; tip.innerHTML = html; tip.hidden = false;
  tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8)+"px"; tip.style.top = (ev.clientY + 14)+"px"; }

let chart = null; // {svg, zoom, graph, ...}
function drawChart(d, year){
  const box = document.getElementById('chartBox');
  const VW = box.clientWidth, VH = box.clientHeight;
  const g = build(d);
  // Lay the whole chart (all four columns) out on a canvas wider than a phone so it keeps
  // natural proportions, then open zoomed out to fit it all (k0). Labels stay a fixed small
  // size on screen and only show where there's room, so item labels appear as you zoom in.
  const LW = Math.max(860, VW < 700 ? VW*2.3 : VW*1.25);
  const LH = LW * Math.min(Math.max(VH/VW*0.75, 0.55), 1.3);
  const k0 = Math.min(VW/LW, VH/LH);
  const nw = 10;
  const graph = d3.sankey().nodeWidth(nw).nodePadding(8).nodeAlign(n=>n.col).nodeSort(null)
    .extent([[0, 0],[LW, LH]])
    ({nodes:g.nodes.map(n=>({...n})), links:g.links.map(l=>({...l}))});
  const fx = [0, .3, .62, 1];
  graph.nodes.forEach(n=>{ const x = fx[n.col]*(LW - nw); n.x0 = x; n.x1 = x + nw; });

  const svg = d3.select('#sankey').attr('width',VW).attr('height',VH).attr('viewBox',`0 0 ${VW} ${VH}`);
  svg.selectAll('*').remove();
  const gz = svg.append('g');
  const linkSel = gz.append('g').selectAll('path').data(graph.links).join('path')
    .attr('class', l=>'link' + (l.target.col===3 ? ' item' : ''))
    .attr('d', d3.sankeyLinkHorizontal()).attr('stroke', l=>l.color).attr('stroke-width', l=>Math.max(1,l.width))
    .on('pointermove',(ev,l)=>showTip(ev, `${l.source.name} → ${l.target.name}<br><b>${gbp(l.value)}</b> · tap to compare years`))
    .on('pointerleave',hideTip)
    .on('click',(ev,l)=>{ hideTip(); openCompare(l.target, year); });
  gz.append('g').selectAll('rect').data(graph.nodes).join('rect')
    .attr('class', n=>'nrect' + (n.col===3 ? ' item' : ''))
    .attr('x',n=>n.x0).attr('y',n=>n.y0).attr('width',n=>n.x1-n.x0).attr('height',n=>Math.max(1,n.y1-n.y0))
    .attr('rx',2).attr('fill',n=>n.color)
    .on('pointermove',(ev,n)=>showTip(ev, `${n.name}<br><b>${gbp(n.value)}</b> · tap to compare years`))
    .on('pointerleave',hideTip)
    .on('click',(ev,n)=>{ hideTip(); openCompare(n, year); });
  const gl = svg.append('g').attr('class','labels');

  let detailOn = null, labels = [];
  function buildLabels(detail){
    gl.selectAll('*').remove();
    labels = graph.nodes.map(n => {
      // items sit at the right edge, so their labels go on the left of the bar, boxed over the flows
      const mode = n.col===0 ? 'right' : n.col===3 ? 'left' : 'center';
      const two = n.col < 3;
      const boxed = true;
      const el = gl.append('g').attr('class','lab'+(boxed?' boxed':'')).style('pointer-events','none');
      const bg = boxed ? el.append('rect').attr('class','lab-bg').attr('rx',5) : null;
      const t = el.append('text').attr('class','nlabel'+(n.col<=2?' big':'')).attr('text-anchor', mode==='left'?'end':mode==='center'?'middle':'start');
      if(two){
        t.append('tspan').attr('x',0).attr('dy', mode==='center' ? '-0.15em' : '-0.2em').text(n.name);
        t.append('tspan').attr('class','amt').attr('x',0).attr('dy','1.2em').text(gbp(n.value));
      } else {
        t.attr('dy','0.35em');
        t.append('tspan').text(n.name+' ');
        t.append('tspan').attr('class','amt').text(gbp(n.value));
      }
      const bb = t.node().getBBox();
      if(bg) bg.attr('x',bb.x-4).attr('y',bb.y-2).attr('width',bb.width+8).attr('height',bb.height+4);
      return {n, el, mode, top:bb.y-2, bot:bb.y+bb.height+2, l:bb.x-4, r:bb.x+bb.width+4};
    });
  }
  function place(t){
    if(detailOn === null){ detailOn = true; buildLabels(true); }
    const taken = []; // screen boxes already claimed, across all columns
    // biggest flows claim label space first; smaller ones appear as you zoom in
    [...labels].sort((a,b)=>b.n.value-a.n.value).forEach(L=>{
      const n = L.n;
      const cx = L.mode==='left' ? t.applyX(n.x0)-6 : L.mode==='center' ? t.applyX((n.x0+n.x1)/2) : t.applyX(n.x1)+6;
      let cy = t.applyY((n.y0+n.y1)/2);
      if(n.col===1) cy = Math.min(Math.max(cy, t.applyY(n.y0)+14, 18), t.applyY(n.y1)-14, VH-18); // keep hub label on screen
      const top = cy + L.top, bot = cy + L.bot, lx = cx + L.l, rx = cx + L.r;
      const off = bot < 0 || top > VH || rx < 0 || lx > VW;
      const clash = taken.some(b => top < b.bot + 2 && bot > b.top - 2 && lx < b.rx + 2 && rx > b.lx - 2);
      const show = !off && !clash;
      if(show) taken.push({top, bot, lx, rx});
      L.el.attr('transform',`translate(${cx},${cy})`).style('display', show ? null : 'none');
    });
  }

  const home = d3.zoomIdentity.translate((VW - LW*k0)/2, (VH - LH*k0)/2).scale(k0);
  const pad = 40;
  const zoom = d3.zoom().scaleExtent([k0*0.8, k0*16]).clickDistance(6)
    .translateExtent([[-pad, -pad],[LW + pad, LH + pad]])
    .on('zoom', ev => { gz.attr('transform', ev.transform); place(ev.transform); });
  svg.call(zoom).on('dblclick.zoom', null);
  svg.call(zoom.transform, home);
  chart = {svg, zoom, home};
}

// ── year comparison: the same chart, one panel per year, all drawn to one scale ──
function valueIn(ref, d){
  if(!d) return null;
  const inT = Object.values(d.income).reduce((a,b)=>a+b,0), outT = Object.values(d.out).reduce((a,v)=>a+total(v),0);
  switch(ref.t){
    case 'in':   return d.income[ref.name] ?? null;
    case 'gap':  return Math.max(0, outT - inT);
    case 'left': return Math.max(0, inT - outT);
    case 'hub':  return Math.max(inT, outT);
    case 'cat':  return d.out[ref.cat]!=null ? total(d.out[ref.cat]) : null;
    default:     return null;
  }
}
function partsIn(ref, d){
  if(ref.t==='cat'){ const c = d.out[ref.cat]; return c && typeof c==='object' ? Object.entries(c).filter(([,v])=>v>0) : []; }
  if(ref.t==='hub'){ const p = Object.entries(d.income).filter(([,v])=>v>0); const gp = valueIn({t:'gap'}, d); if(gp>0) p.push(['Drawn from balance', gp]); return p; }
  return [];
}
// One-off vs ongoing. Part years only pro-rate ongoing costs (ASDA, bills…); one-off costs
// (holidays, home projects…) are shown as actually spent so far. A cost is one-off if its
// category is lumpy by nature, it's a known seasonal item, or its spending pattern says so
// (most of the year's spend landed in one or two months — the parser's "lumpy" check).
const ONE_OFF_CATS = new Set(['Mortgage overpayment','House & holiday (capex)','Other transfers','Holidays','Home projects','Parties & weddings','Annual payments']);
const ONE_OFF_ITEMS = new Set(['Christmas','Birthdays & anniv.',"Ben's phone",'Emily (one-off, April)','Ben (one-off)','Emily (one-off)']);
function isOneOff(D, cat, item){
  if(ONE_OFF_CATS.has(cat)) return true;
  if(item && ONE_OFF_ITEMS.has(item)) return true;
  return !!(D.lumpy && D.lumpy[cat+'›'+(item||'')]);
}
const proFactor = (D, cat, item) => DATA.noPro || D.months >= 12 || isOneOff(D, cat, item) ? 1 : 12 / D.months;

const ITEM_COLORS = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7']; // fixed order, never cycled
function cleanDesc(d){
  return d.replace(/^Card Transaction \d+ \d{2}[A-Z]{3}\d{2} (?:CD |[CD] )?/,'').replace(/^OnLine Transaction /,'').replace(/^Direct Debit /,'Direct debit ')
    .replace(/ VIA MOBILE - PYMT.*$/,'').replace(/ (?:FP|BGC|DDR)? ?\d{2}\/\d{2}\/\d{2}.*$/,'').replace(/\s+\d{6,}.*$/,'').replace(/\s+(?:GB|UK)$/,'').replace(/\s+/g,' ').trim();
}

function openCompare(n, year, fromYears){
  let ref = n.ref || {}, hl = null, only = null;
  if(ref.t==='item'){ hl = ref.item; if(!n.showAll) only = ref.item; ref = {t:'cat', cat:ref.cat}; }
  else if(ref.t==='other'){ ref = {t:'cat', cat:ref.cat}; }
  const title = ref.t==='cat' ? ref.cat : n.name;
  const focusColor = ref.t==='cat' ? famColor(CATS[ref.cat]||'home') : (n.color || css('--c-in'));
  const isIncome = ref.t==='in' || ref.t==='hub' || ref.t==='left';
  const yrs = yearKeys();
  const PH = document.getElementById('chartBox').clientHeight;

  const catKey = ref.t==='cat' ? ref.cat : 'income';
  let rows = yrs.map(y => {
    const D = DATA.years[y];
    const parts = partsIn(ref, D).map(([k,v]) => { const f = proFactor(D, catKey, k); return {k, v, a:v*f, pro:f>1}; });
    let focus = valueIn(ref, D), fa = null, pro = false;
    if(ref.t==='hub') focus = parts.reduce((s,p)=>s+p.v,0);
    if(focus != null){
      if(parts.length){ fa = parts.reduce((s,p)=>s+p.a,0); pro = parts.some(p=>p.pro); }
      else { const f = proFactor(D, catKey, ref.t==='in' ? ref.name : null); fa = focus*f; pro = f>1; }
    }
    const anyOne = parts.length ? parts.some(p=>!p.pro) : !pro;
    return {y, D, focus, fa, pro, anyOne, parts};
  });
  // Tapping a single item (e.g. Tesco) compares just that item year by year; the rest of its category is left out.
  if(only) rows = rows.map(r => {
    const parts = r.parts.filter(p => p.k === only), has = parts.length > 0;
    return {...r, parts, focus: has ? parts.reduce((a,p)=>a+p.v,0) : null, fa: has ? parts.reduce((a,p)=>a+p.a,0) : null,
            pro: parts.some(p=>p.pro), anyOne: has ? parts.some(p=>!p.pro) : false};
  });
  // Items get one colour each, the same in every year. The 7 biggest (over all years, plus any
  // highlighted item) get their own colour; the rest are folded into "Other".
  const sizes = {}; rows.forEach(r => r.parts.forEach(p => sizes[p.k] = (sizes[p.k]||0) + p.a));
  let keys = Object.keys(sizes).sort((a,b)=>sizes[b]-sizes[a]);
  let named = keys.slice(0, keys.length > 7 ? 6 : 7);
  if(hl && keys.includes(hl) && !named.includes(hl)) named = [...named.slice(0, named.length-1), hl];
  const color = {}; named.forEach((k,i) => color[k] = ITEM_COLORS[i]); color['Other'] = css('--c-in');
  // A tapped item is pinned to the top of every year's stack, so its blocks share one baseline.
  if(hl && named.includes(hl)) named = [hl, ...named.filter(k => k !== hl)];
  const order = [...named, 'Other'];
  rows.forEach(r => {
    const keep = r.parts.filter(p => named.includes(p.k)), rest = r.parts.filter(p => !named.includes(p.k));
    if(rest.length) keep.push({k:'Other', v:rest.reduce((s,p)=>s+p.v,0), a:rest.reduce((s,p)=>s+p.a,0), pro:rest.some(p=>p.pro), n:rest.length});
    r.parts = keep.sort((a,b)=>order.indexOf(a.k)-order.indexOf(b.k));
  });

  const canPick = ref.t==='cat' && !only;   // in a category view every item can be tapped to compare just that item
  // first tap pins the item to the top with everything else still drawn; tapping the pinned item again shows it alone
  const pickItem = k => openCompare({name:k, color:focusColor, ref:{t:'item', cat:ref.cat, item:k}, showAll: k !== hl}, year, fromYears);
  const sel = rows.find(r=>r.y===year);
  const maxA = Math.max(...rows.map(r=>Math.max(r.fa||0, r.parts.reduce((s,p)=>s+p.a,0))), 1);
  const maxParts = Math.max(...rows.map(r=>r.parts.length), 0);
  const GAP = 3, TOP = 6, BOT = 6;
  const s = (PH - TOP - BOT - Math.max(0,maxParts-1)*GAP) / maxA;   // £ → px, shared by every year

  let html = `<div class="cmp-grid" style="grid-template-columns:repeat(${rows.length},minmax(0,1fr))">`;
  rows.forEach((r, ri) => {
    const me = r.y===year, part = r.D.months < 12, ap = r.pro ? '≈' : '';
    // small ▲/▼ % per item against the year before (same pro-rating as the amounts)
    const prev = ri > 0 ? new Map(rows[ri-1].parts.map(p=>[p.k, p.a])) : null;
    const chg = p => {
      if(!prev || p.k==='Other' || !rows[ri-1].focus) return '';
      const b = prev.get(p.k);
      if(!b) return `<span class="ch new">new</span>`;
      const pct = (p.a - b) / b * 100;
      if(Math.abs(pct) < 0.5) return `<span class="ch flat">0%</span>`;
      const good = isIncome ? pct > 0 : pct < 0;
      return `<span class="ch ${good?'good':'bad'}">${pct>0?'▲':'▼'}${Math.abs(pct).toFixed(0)}%</span>`;
    };
    const range = part ? `Jan–${MON[r.D.months-1]}` : '';
    const how = DATA.subs ? (DATA.subs[r.y]||'') : !part ? 'Full year' : !r.pro ? `${range} · one-off, as spent` : r.anyOne ? `${range} · ongoing ×${+(12/r.D.months).toFixed(1)}, one-offs as spent` : `${range} ×${+(12/r.D.months).toFixed(1)}`;
    const soFar = sel && sel.D.months < 12 && sel.anyOne ? ' so far' : '';
    let delta = '';
    if(!me && sel && sel.fa!=null && r.fa){
      const diff = sel.fa - r.fa, pct = diff/r.fa*100, good = isIncome ? diff>=0 : diff<=0;
      delta = Math.abs(diff) < 1 ? `Same as ${lab(year)}` : `<span class="${good?'good':'bad'}">${lab(year)}${soFar}: ${diff>0?'▲':'▼'}${gbp(Math.abs(diff))} (${diff>0?'+':'−'}${Math.abs(pct).toFixed(0)}%)</span>`;
    }

      <div class="r-grid">${['Cash','Savings','Investments'].concat(kids?[FS_KIDS]:[]).map(g=>`<span><i style="background:${gColor(g)}"></i>${g}</span><b class="mono">${gbp(v[g])}</b>`).join('')}${[['Credit card',v.card],['Student loan',v.student],['Other debts',v.otherDebt]].filter(d=>Math.abs(d[1])>=0.5).map(d=>`<span><i style="background:${gColor('Liabilities')}"></i>${d[0]}</span><b class="mono">${signed(d[1])}</b>`).join('')}${f?`<span><i class="ln dash"></i>Free after pots</span><b class="mono">${signed(f)}</b>`:''}</div>
      <button class="linkbtn" id="toAssets">See the asset list for ${mLabel(m)} →</button>`;
    document.getElementById('toAssets').onclick = () => { prefs.asof = m; prefs.src = 'assets'; savePrefs(); render(); }; };
  const pick = ev => { const r = svgEl.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width); show(Math.max(0, Math.min(n-1, Math.round((px - L) / (W-L-R) * (n-1))))); };
  svg.append('rect').attr('x',L).attr('y',T).attr('width',W-L-R).attr('height',H-T-B).attr('fill','transparent').style('touch-action','pan-y').style('cursor','crosshair')
    .on('pointermove', pick).on('pointerdown', pick);

function spark(vals, w, h, color){
  const pts = vals.filter(v => v!=null); if(pts.length < 2) return '';
  const lo = Math.min(...pts, 0), hi = Math.max(...pts, 1), n = vals.length;
  const d = vals.map((v,i) => v==null ? null : `${(i/(n-1)*w).toFixed(1)},${(h - (v-lo)/(hi-lo||1)*(h-2) - 1).toFixed(1)}`).filter(Boolean);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${d.join(' ')}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
function bigLine(a, months, color){
  const W = 520, H = 120, ks = months.filter(m => a.series[m]!=null); if(ks.length < 2) return '';
  const vs = ks.map(m => a.series[m]), lo = Math.min(0, ...vs), hi = Math.max(...vs, 1), pos = ks.map((m,i) => [i/(ks.length-1)*(W-4)+2, H - 16 - (a.series[m]-lo)/(hi-lo||1)*(H-26)]);
  const pk = vs.indexOf(Math.max(...vs));
  return `<svg class="big-line" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pos.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="2"/><circle cx="${pos[pk][0]}" cy="${pos[pk][1]}" r="3.5" fill="${color}"/></svg>`;
}
function pensionHtml(){
  const p = PENSION, gs = p.growth/p.value*100;
  return `<section class="as-sec"><div class="as-head"><i style="background:${css('--c-annual')}"></i><h3>Pension</h3><span class="mono">${gbp(p.value)}</span></div>
    <p class="note" style="margin:6px 0">As at ${p.asof}. Not counted in the totals above, since you can’t spend it yet.</p>
    <div class="m-split"><i style="width:${(100-gs).toFixed(1)}%;background:${css('--c-in')}"></i><i style="width:${gs.toFixed(1)}%;background:${css('--c-left')}"></i></div>
    ${pensionChart()}<p class="note" style="margin:2px 0 6px">Dots are values from your pension sheet and today’s figure. The line between them is an estimate.</p>
    <div class="facts"><span>Paid in <b>${gbp(p.paidIn)}</b> (${Math.round(100-gs)}%)</span><span>Growth <b>${gbp(p.growth)}</b> (${Math.round(gs)}%)</span><span>Growth on what you paid in <b>${Math.round(p.growth/p.paidIn*100)}%</b></span></div></section>`;
}
function mortgageHtml(){
  const m = MORTGAGE, core = m.capital + m.interest, extra = m.payment - core, r = m.interest / m.balance, pct = (r*1200).toFixed(2);
  const yrs = core > m.interest ? Math.log(1 - m.interest/core) / -Math.log(1 + r) / 12 : null;
  const yrs2 = m.payment > m.interest ? Math.log(1 - m.interest/m.payment) / -Math.log(1 + r) / 12 : null, eq = m.house - m.balance;
  const cs = m.capital/core*100;
  return `<section class="as-sec"><div class="as-head"><i style="background:${css('--c-home')}"></i><h3>Home loan</h3><span class="mono neg">${signed(-m.balance)}</span></div>
    <p class="note" style="margin:6px 0">As at ${m.asof}. Not counted in the totals above; the house is shown below it.</p>
    <div class="m-split"><i style="width:${cs.toFixed(1)}%;background:${css('--c-left')}"></i><i style="width:${(100-cs).toFixed(1)}%;background:${css('--c-gap')}"></i></div>
    <div class="facts"><span>Capital <b>${gbp(m.capital)}</b> (${Math.round(cs)}%)</span><span>Interest <b>${gbp(m.interest)}</b> (${Math.round(100-cs)}%)</span>${extra>0.5?`<span>Overpayment <b>${gbp(extra)}</b> a month</span>`:''}</div>
    <div class="facts" style="margin-top:4px"><span>Rate implied by interest: <b>~${pct}%</b></span>${yrs2?`<span>Clear in about <b>${yrs2.toFixed(1)} years</b> with the overpayment</span>`:''}${yrs&&yrs2?`<span>(${yrs.toFixed(1)} without)</span>`:''}</div>
    <div class="facts" style="margin-top:4px"><span>House <b>${gbp(m.house)}</b> (${m.houseNote})</span><span>Equity <b>${gbp(eq)}</b></span><span>Loan to value <b>${Math.round(m.balance/m.house*100)}%</b></span></div></section>`;
}
const openAssets = new Set();
function renderAssets(){
  const M = fullModel(), el = document.getElementById('assetsView'), all = M.all;
  const mode = prefs.asof && prefs.asof!=='latest' && all.includes(prefs.asof) ? prefs.asof : 'latest';
  const ref = mode==='latest' ? M.latest : mode;
  const keyOf = a => { if(mode!=='latest') return a.series[mode]!=null ? mode : null; const ks = Object.keys(a.series).filter(k => a.series[k]!=null && k<=M.latest).sort(); return ks.length ? ks[ks.length-1] : null; };
  const yearAgo = m => { const [y,mm] = m.split('-'); return `${+y-1}-${mm}`; };
  const rows = M.F.assets.map(a => { const k = keyOf(a), v = k ? a.series[k] : null;
    const stale0 = mode==='latest' && k && k < FF_FROM && a.group!==FS_KIDS; const prevK = k ? yearAgo(k) : null, pv = prevK ? a.series[prevK] : null;
    const hist = all.filter(m => m <= (k||ref)).slice(-36).map(m => a.series[m] ?? null);
    return {a, k, v: stale0 ? 0 : v, change: v!=null && pv!=null ? v - pv : null, hist}; });
  const live = r => r.v!=null && Math.abs(r.v) >= 0.5;
  const order = ['Cash','Savings','Investments','Liabilities',FS_KIDS];
  const tot = g => rows.filter(r => r.a.group===g && !r.a.memo && live(r)).reduce((s,r) => s + r.v, 0);
  const mine = tot('Cash') + tot('Savings') + tot('Investments'), debts = tot('Liabilities'), kidsT = tot(FS_KIDS);
  const sec = g => { const rs = rows.filter(r => r.a.group===g && !r.a.memo); const lv = rs.filter(live).sort((x,y) => Math.abs(y.v)-Math.abs(x.v)), gone = rs.filter(r => !live(r) && r.k);
    if(!lv.length && !gone.length) return '';
    const gt = lv.reduce((s,r) => s + r.v, 0), base = g==='Liabilities' ? 0 : (g===FS_KIDS ? kidsT : mine) || 1;
    return `<section class="as-sec${g==='Liabilities'?' as-debts':''}"><div class="as-head"><i style="background:${gColor(g)}"></i><h3>${g==='Liabilities'?'Debts':g}</h3><span class="mono">${signed(gt)}</span>${g!=='Liabilities' && g!==FS_KIDS ? `<span class="pct">${Math.round(gt/mine*100)}%</span>` : ''}</div>
      ${g===FS_KIDS?'<p class="note" style="margin:0 0 6px">Held for the children, so not counted in your net worth.</p>':''}
      <ul class="as-list">${lv.map(r => rowHtml(r, base, g)).join('')}</ul>
      ${gone.length ? `<details class="as-gone"><summary>${gone.length} closed, empty or not updated recently</summary><ul class="as-list">${gone.map(r => rowHtml(r, 1, g, true)).join('')}</ul></details>` : ''}</section>`; };
  const rowHtml = (r, base, g, gone) => { const a = r.a, open = openAssets.has(a.id), stale = r.k && r.k !== ref && mode==='latest';
    const peakK = Object.keys(a.series).reduce((b,k) => (Math.abs(a.series[k]) > Math.abs(a.series[b] ?? 0) ? k : b), Object.keys(a.series)[0]);
    const firstK = Object.keys(a.series).filter(k => a.series[k]).sort()[0], lastK = Object.keys(a.series).filter(k => a.series[k]).sort().pop();
    return `<li class="as-row${open?' open':''}" data-id="${a.id}"><button class="as-main" aria-expanded="${open}">
        <span class="nm">${a.name}${a.counted?'':' <em class="nc" title="Not in your sheet’s own total">not in sheet total</em>'}${stale?` <em class="nc">as of ${mLabel(r.k)}</em>`:''}</span>
        <span class="sp">${gone ? '' : spark(r.hist, 64, 20, gColor(g))}</span>
        <span class="am mono">${gone ? '–' : signed(r.v)}</span>
        <span class="chg ${r.change==null?'':(g==='Liabilities'? r.change>0 : r.change<0)?'neg':'pos'}">${r.change==null?'':(r.change<0?'▼ ':'▲ ')+gbp(Math.abs(r.change))}</span>
        ${gone ? '' : `<span class="bar-sh"><i style="width:${Math.min(100,Math.max(0,Math.abs(r.v)/Math.abs(base)*100)).toFixed(1)}%;background:${gColor(g)}"></i></span>`}
      </button>
      ${open ? `<div class="as-det">${bigLine(a, all, gColor(g))}<div class="facts"><span>First: <b>${firstK?mLabel(firstK):'–'}</b></span><span>Peak: <b>${gbp(a.series[peakK]||0)}</b> · ${peakK?mLabel(peakK):''}</span><span>Last: <b>${lastK?mLabel(lastK):'–'}</b></span></div>${a.note?`<p class="note" style="margin:6px 0 0">${a.note}</p>`:''}</div>` : ''}</li>`; };
  const debtRows = rows.filter(r => r.a.group==='Liabilities' && !r.a.memo && live(r));
  const dv = id => debtRows.filter(r => r.a.id===id).reduce((s,r)=>s+r.v,0), dOther = debts - dv('cc') - dv('student');
  const debtSplit = [['Card',dv('cc')],['Student loan',dv('student')],['Other',dOther]].filter(d=>Math.abs(d[1])>=0.5).map(d=>`${d[0]} ${signed(d[1])}`).join(' · ') || 'none';
  const memo = rows.filter(r => r.a.memo && r.k);
  el.innerHTML = `
    <div class="stats">
      <div class="stat"><span class="k">Assets</span><span class="v">${gbp(mine)}</span><span class="s">cash, savings, investments</span></div>
      <div class="stat soft"><span class="k">Debts</span><span class="v">${debts?gbp(-debts):'£0'}</span><span class="s">${debtSplit}</span></div>
      <div class="stat"><span class="k">Net worth</span><span class="v">${signed(mine+debts)}</span><span class="s">${mode==='latest'?'latest known':mLabel(mode)}</span></div>
    </div>
    <div class="as-bar"><label>As at <select id="asofSel"><option value="latest"${mode==='latest'?' selected':''}>Latest known</option>${[...M.months].reverse().map(m=>`<option value="${m}"${m===mode?' selected':''}>${mLabel(m)}</option>`).join('')}</select></label>
      <span class="note" style="margin:0">Tap an account for its history${mode==='latest'?'. Each account shows its latest figure; the date is shown where it’s older':''}.</span></div>
    ${order.map(sec).join('')}
    ${pensionHtml()}
    ${mortgageHtml()}
    <p class="note">Built from the Full Summary sheet. Accounts marked “not in sheet total” are ones your own total leaves out; they are included here so the list is complete.</p>`;
  document.getElementById('asofSel').onchange = e => { prefs.asof = e.target.value; savePrefs(); renderAssets(); };
  el.querySelectorAll('.as-row').forEach(li => li.querySelector('.as-main').onclick = () => { const id = li.dataset.id; openAssets.has(id) ? openAssets.delete(id) : openAssets.add(id); renderAssets(); });
}

// ── page ──
function render(){
  applySrc();
  const flow = isFlow();
  document.getElementById('flowView').hidden = !flow;
  document.getElementById('worthView').hidden = prefs.src !== 'worth';
  document.getElementById('assetsView').hidden = prefs.src !== 'assets';
  document.getElementById('yearsBtn').hidden = !flow;
  document.getElementById('zoomHint').hidden = !flow;
  document.getElementById('yearTabs').hidden = !flow;
  const tabs = [['joint','Joint account'],['nw','Ben’s cash flow'],['worth','Net worth'],['assets','Assets']];
  document.getElementById('srcTabs').innerHTML = tabs.map(([k,t])=>`<button class="src-tab${prefs.src===k?' active':''}" data-s="${k}">${t}</button>`).join('');
  document.querySelectorAll('.src-tab').forEach(b=>b.onclick=()=>{ if(prefs.src===b.dataset.s) return; prefs.src=b.dataset.s; prefs.year=null; savePrefs(); setTimeout(render,0); });
  const vt = document.getElementById('viewTabs'); vt.hidden = !isNW();
  vt.innerHTML = isNW() ? [['years','By year'],['stmts','By statement']].map(([k,t])=>`<button class="sub-tab${prefs.nwView===k?' active':''}" data-v="${k}">${t}</button>`).join('') : '';
  vt.querySelectorAll('.sub-tab').forEach(b=>b.onclick=()=>{ prefs.nwView=b.dataset.v; prefs.year=null; savePrefs(); setTimeout(render,0); });
  document.querySelector('.top .eyebrow').textContent = ({joint:'Joint account · where it all went', nw:'Ben’s NatWest · personal account', worth:'Net worth · cash, savings and investments', assets:'Every account, savings pot and investment'})[prefs.src] || '';
  document.getElementById('resetBtn').hidden = !(flow && !isNW() && usingImport) && !(usingExtra && !flow);
  if(!flow){ document.getElementById('legend').innerHTML = ''; if(prefs.src === 'worth') renderWorth(); else renderAssets(); return; }
  const yrs = Object.keys(DATA.years).sort();
  if(!prefs.year || !DATA.years[prefs.year]) prefs.year = isStm() ? 'ALL' : (yrs.find(y=>DATA.years[y].months>=12 && y===String(new Date().getFullYear()-1)) || yrs[yrs.length-1]);
  document.getElementById('yearsBtn').textContent = isStm() ? 'Compare months' : 'Compare all years';
  document.getElementById('yearTabs').classList.toggle('many', yrs.length > 6);
  const year = prefs.year, d = DATA.years[year];
    document.getElementById('src').textContent = DATA.source + '.';
  document.getElementById('yearTabs').innerHTML = yrs.map(y=>{
    const m = DATA.years[y].months;
    return `<button class="yr-tab${y===year?' active':''}" role="tab" aria-selected="${y===year}" data-y="${y}">${lab(y)}<span class="sub">${DATA.subs ? DATA.subs[y] : m>=12?'full year':'Jan–'+MON[m-1]}</span></button>`;
  }).join('');
  document.querySelectorAll('.yr-tab').forEach(b=>b.onclick=()=>{ prefs.year=b.dataset.y; savePrefs(); setTimeout(render,0); });

  const g = build(d), net = g.inTot - g.outTot, mort = total(d.out.Mortgage || 0);
  document.getElementById("stats").innerHTML = `
    <div class="stat"><span class="k">Money in</span><span class="v">${gbp(g.inTot)}</span><span class="s">${DATA.subs ? DATA.subs[year] : yearLabel(year,d.months)}</span></div>
    <div class="stat"><span class="k">Money out</span><span class="v">${gbp(g.outTot)}</span><span class="s">${isNW() ? Math.round(total(d.out['Paid into joint account']||0)/g.outTot*100)+'% paid into the joint account' : Math.round(mort/g.outTot*100)+'% on the mortgage'}</span></div>
    <div class="stat"><span class="k">Net</span><span class="v ${net<0?'neg':'pos'}">${net<0?'−':'+'}${gbp(Math.abs(net))}</span><span class="s">${net<0?'Spent more than came in':'Left in the account'}</span></div>`;
  let nt = d.note || '';
  if(!isStm() && isNW() && !nt){ const pm = y => total(DATA.years[y].income)/Math.max(DATA.years[y].months,1), others = Object.keys(DATA.years).filter(y=>y!==year).map(pm).sort((a,b)=>a-b);
    if(others.length >= 2 && pm(year) > 1.8*others[Math.floor(others.length/2)]) nt = 'Income looks high for this year (about '+gbp(pm(year))+' a month against '+gbp(others[Math.floor(others.length/2)])+' in other years). The sheet probably counts transfers between your own accounts as income, so treat the net figure with care.'; }
  document.getElementById("note").textContent = nt;
  drawChart(d, year);

  const fams = [...new Set(Object.keys(d.out).map(k=>CATS[k]||'home'))];
  document.getElementById("legend").innerHTML =
    `<span><i style="background:${css('--c-in')}"></i>Income</span>` +
    (Object.keys(d.income).some(k=>/top-ups/.test(k)) ? `<span><i style="background:${css('--c-top')}"></i>Top-ups</span>` : '') +
    fams.map(f=>`<span><i style="background:${famColor(f)}"></i>${FAMLABEL[f]}</span>`).join("") +
    (net<0?`<span><i style="background:${css('--c-gap')}"></i>Drawn from balance</span>`:`<span><i style="background:${css('--c-left')}"></i>Left over</span>`);
  renderTable(d, g, year);
  renderTie();
}

function renderTie(){
  const el = document.getElementById('tie');
  if(!isStm()){ el.hidden = true; return; }
  const f2 = v => '£' + v.toLocaleString('en-GB',{minimumFractionDigits:2, maximumFractionDigits:2});
  const rows = NW_DATA.stmts.map(z => {
    const bad = Math.abs(z.missing) >= 0.005;
    return `<tr><td>${z.range}</td><td>${f2(z.open)}</td><td>${f2(z.pin)}</td><td>${f2(z.wd)}</td><td>${f2(z.close)}</td><td class="${bad?'warn':'ok'}">${bad ? '⚠ '+f2(z.missing)+' short' : '✓ ties'}</td></tr>`;
  }).join('');
  const sheet = [['31 Jan','£385','£384.86','✓ ties'],['Feb','£36','£37.03 on 26 Feb, £64.03 on 27 Feb','≈ close'],['Mar','£3,922','£334.46 at 31 Mar','⚠ no match; looks like a mid-May balance (£3,927 on 18 May)']];
  el.hidden = false;
  el.innerHTML = `<h2>Ties to the statements</h2>
    <p class="tie-note">Each statement’s opening, paid in, withdrawn and closing figures, checked against the transactions read from it. Refunds are netted in the breakdown, so category totals differ slightly from the bank’s paid-in and withdrawn. The 14 Mar–13 Apr statement’s page 3 was added from a screenshot.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Statement</th><th>Opening</th><th>Paid in</th><th>Withdrawn</th><th>Closing</th><th>Check</th></tr></thead><tbody>${rows}</tbody></table></div>
    <h2 style="margin-top:16px">Your sheet’s NatWest line</h2>
    <p class="tie-note">The “Full Summary” row for the Select account, against the statement balance for that month-end.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Month</th><th>Sheet</th><th>Statement</th><th>Result</th></tr></thead><tbody>${sheet.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>`;
}
const openCats = new Set();
function renderTable(d, g, year){
  let h = `<thead><tr><th>Category</th><th>Amount</th><th>Per month</th><th>% of in</th></tr></thead><tbody>`;
  for (const [cat,v] of Object.entries(d.out).sort((a,b)=>total(b[1])-total(a[1]))){
    const t = total(v), multi = typeof v === "object", open = openCats.has(cat);
    h += `<tr class="row" data-cat="${cat}"><td>${multi?`<button class="chev" data-toggle="${cat}" aria-expanded="${open}" aria-label="Show items">${open?'▾':'▸'}</button>`:'<span class="chev-sp"></span>'}<span class="sw" style="background:${famColor(CATS[cat]||'home')}"></span>${cat}</td><td>${gbp(t)}</td><td>${gbp(t/(d.div||d.months))}</td><td>${(t/g.inTot*100).toFixed(1)}%</td></tr>`;
    if (multi && open) for (const [k,val] of Object.entries(v).sort((a,b)=>b[1]-a[1]))
      h += `<tr class="row sub" data-cat="${cat}" data-item="${k}"><td>${k}</td><td>${gbp(val)}</td><td>${gbp(val/(d.div||d.months))}</td><td>${(val/g.inTot*100).toFixed(1)}%</td></tr>`;
  }
  h += `</tbody><tfoot><tr><td>Total out</td><td>${gbp(g.outTot)}</td><td>${gbp(g.outTot/(d.div||d.months))}</td><td>${(g.outTot/g.inTot*100).toFixed(1)}%</td></tr></tfoot>`;
  const tbl = document.getElementById("tbl"); tbl.innerHTML = h;
  tbl.querySelectorAll('tr.row').forEach(r=>r.onclick=ev=>{
    const tg = ev.target.closest('[data-toggle]');
    if(tg){ const c = tg.dataset.toggle; openCats.has(c)?openCats.delete(c):openCats.add(c); setTimeout(()=>renderTable(d,g,year),0); return; }
    const cat = r.dataset.cat, item = r.dataset.item, color = famColor(CATS[cat]||'home');
    openCompare(item ? {name:item, color, ref:{t:'item',cat,item}} : {name:cat, color, ref:{t:'cat',cat}}, year);
  });
}

let rt, lastW = window.innerWidth; window.addEventListener("resize",()=>{ if(window.innerWidth===lastW) return; lastW=window.innerWidth; clearTimeout(rt); rt=setTimeout(render,150); });
document.getElementById('versionBadge').textContent = `v${APP_VERSION}`;

<!DOCTYPE html>
<!--

  WHAT THIS IS
  A single-file PWA that draws a Sankey diagram per year of the household
  joint account (Santander), in the style of the r/FIREUK SankeyMATIC posts:
  income sources → household pot → spending categories → individual items.
  Data comes from the "Santander" sheet of Ben's "2026 Finances" workbook.
  Intended repo: bengalebg23/MoneyFlow, served via GitHub Pages at
  bengalebg23.github.io/MoneyFlow/.

  ARCHITECTURE
  - Single index.html, vanilla JS, no build step. Same pattern and look as
    MealRota (Inter + IBM Plex Mono + Patrick Hand, #F7F8FA ground).
  - d3 7.9.0 + d3-sankey 0.12.3 draw the chart; SheetJS 0.18.5 reads the xlsx.
  - NOTHING PERSONAL IS BUILT IN (since v1.19.0). Every figure comes from the workbook on
    "Load spreadsheet" and is kept in this browser's localStorage only:
      · Santander sheet → joint years (STORE_KEY); Joint transactions tab → statement lines (JTX_KEY)
      · Full Summary sheet → net worth, assets, NatWest years, payslip months (EXTRA_KEY / PAY_KEY)
      · NatWest transactions tab (Date | Amount | Description | Category | Item) and the App data tab
        (Key | Part | JSON; long values split across Parts) → APP_KEY, read into AD at start-up: nwData
        (statement periods + stmts), miraClaims, adds, student, ovr, closed, events, notes, mortgage,
        pension, penPts, payDefaults, nwSheetTie, nwTieNote. Loading those tabs reloads the page so
        the NatWest pipeline (itemiseGaps, netSprive, netClaims) runs on the fresh data.
    A workbook with only the App data / NatWest tabs (no Santander sheet) is accepted too.
    Each tab with nothing loaded shows a "Load your finances workbook" card (#emptyView).
    "Clear loaded data" wipes all four keys. Git history before v1.19.0 still holds the old figures.
    Parser rules (parseSantander):
      · year blocks = each "Dec" in the month header row, 12 cols Dec→Jan;
        block year = the number above its BUDGET column (block+13), else above
        the block. (The sheet's top-left block is labelled 2025 but is 2026.)
      · a block with ≥10 months of mortgage is summed month by month; older
        partial blocks use the annual TOTAL column at block−5.
      · sections come from col A headers (income, Baseline, Food, variable,
        Bills, Savings, House, Parties, Holiday, Annual payments); items from
        col B. "Total"/blank rows and zero/negative items are skipped.
      · older years (annual mode) take Ben/Emily from their Total rows, and a
        category falls back to its single total when its items don't add up
        to within 10% (the 2024 food items hold monthly averages).
  - Nothing is synced; localStorage only. No Firebase needed.

  LAYERS (Ben's terms)
  Layer 1 = the full-year overview (Sankey, stats, table, Compare all years).
  Layer 2 = a dive into one category, or into money in (openCompare, ref cat / hub).
  Layer 3 = a dive into one item's own breakdown (openCompare with only=item, SUB_ITEMS).

<html lang="en">

<style>
  :root{
    --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#EEF1F5; --line:#D7DCE3;
    --paper:#26313F; --paper-dim:#5b6b7d; --muted:#6b7a8c;
    --mustard:#2F6FE4; --mustard-dim:#1f4fb0; --rose:#F0703C; --today:#2FA84F;
    --c-home:#2a78d6; --c-food:#eb6834; --c-spend:#1baf7a; --c-kids:#e87ba4;

    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}

  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }
  .display{font-family:'Patrick Hand',cursive;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  header.top{
    padding:calc(14px + env(safe-area-inset-top,0px)) 18px 10px;
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 80%, transparent); backdrop-filter:blur(6px);
  }
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 2px;}

  .title-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 9px;}
  .version-badge{flex:none; font-size:11px; font-weight:600; color:var(--mustard); background:var(--surface); border:1px solid var(--mustard-dim); padding:4px 9px; border-radius:20px;}
  .year-tabs{display:flex; gap:5px;}
  .yr-tab{

    font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--paper-dim); cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .src-tabs{display:flex; gap:6px; margin:0 0 8px;}
  .src-tab{border:1px solid var(--line); background:var(--surface); color:var(--paper-dim); border-radius:999px; padding:5px 12px; font:600 12px 'Inter',sans-serif; cursor:pointer;}
  .src-tab.active{background:var(--paper); color:#fff; border-color:var(--paper);}
  .year-tabs.many{overflow-x:auto; padding-bottom:3px; -webkit-overflow-scrolling:touch;} .year-tabs.many .yr-tab{flex:none; min-width:58px;}

  .yr-tab .sub{display:block; font-family:'Inter',sans-serif; font-size:8px; font-weight:500; letter-spacing:.06em; margin-top:1px; opacity:.7; text-transform:uppercase;}
  .yr-tab.active{background:var(--mustard); color:#fff; border-color:var(--mustard);}
  .yr-tab:focus-visible, button:focus-visible, label.chk:focus-within{outline:2px solid var(--mustard); outline-offset:2px;}

  main{max-width:1180px; margin:0 auto; padding:16px 18px 0; display:grid; gap:16px;}
  main > *{min-width:0;} .top > *{min-width:0; max-width:100%;}
  .ys-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;} .ys-wrap{min-width:0;} .cmp-body{grid-template-columns:minmax(0,1fr);}
  .stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px;}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; display:grid; gap:2px; min-width:0;}
  .stat .k{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}
  .stat .v{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:clamp(17px,4.4vw,26px); font-variant-numeric:tabular-nums;}
  .stat .s{font-size:12px; color:var(--paper-dim);}
  .neg{color:var(--c-gap);} .pos{color:var(--today);}
  .roy-tbl{min-width:0 !important; width:100%;} .roy-tbl th, .roy-tbl td{padding:7px 4px !important; font-size:11.5px !important; white-space:nowrap;} .roy-tbl th{font-size:9.5px !important; letter-spacing:.04em !important;}

  .oo-cat li.roy-in, .oo-cat li.roy-ex{grid-template-columns:minmax(0,1fr) 104px;} .oo-cat li.roy-add{grid-template-columns:minmax(0,1fr) auto 96px auto;}

  .roy-num, .roy-txt, .roy-add select{font:14px 'IBM Plex Mono',monospace; padding:6px 7px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--paper); width:100%; box-sizing:border-box; min-width:0;}
  .roy-num{text-align:right;} .roy-txt{font-family:'Inter',sans-serif;} .roy-add .x{border:0; background:none; color:var(--paper-dim); font-size:15px; cursor:pointer; padding:4px;}
  .roy-num:disabled, .roy-txt:disabled, .roy-add select:disabled{opacity:.6;}
  .empty-view{padding:16px 18px;} .empty-view h2{margin:0 0 6px;} .empty-view p{margin:6px 0; font-size:14px; color:var(--paper-dim);}

  .bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between;}
  label.chk{display:inline-flex; gap:7px; align-items:center; font-size:13px; color:var(--paper-dim); cursor:pointer; border-radius:8px;}
  label.chk input{accent-color:var(--mustard); width:16px; height:16px;}
  .btn{font:inherit; font-size:13px; font-weight:600; padding:7px 12px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--paper); cursor:pointer;}
  .btn.primary{background:var(--mustard); border-color:var(--mustard); color:#fff;}
  .btns{display:flex; gap:6px; flex-wrap:wrap;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:10px 0; position:relative;}
  .scroller{overflow-x:auto; -webkit-overflow-scrolling:touch;}

  .nlabel .amt{fill:var(--paper-dim); font-family:'IBM Plex Mono',monospace; font-size:9.5px;}

<script>
const APP_VERSION = '1.19.0';
const STORE_KEY = 'moneyflow.data.v1';
const PREF_KEY = 'moneyflow.prefs.v1';
const EXTRA_KEY = 'moneyflow.extra.v1';
const APP_KEY = 'moneyflow.app.v1';
// Nothing personal is built into this file. Every figure comes from the workbook on "Load spreadsheet" and
// is kept on this device only: the Santander sheet, the Joint transactions tab and the Full Summary sheet
// (STORE_KEY / JTX_KEY / EXTRA_KEY), plus the "NatWest transactions" and "App data" tabs (APP_KEY, read below).
const AD = (() => { try{ return JSON.parse(localStorage.getItem(APP_KEY)) || {}; }catch(e){ return {}; } })();

const CATS = { // category → colour family, in display order of the legend
  "Mortgage":"home","Mortgage overpayment":"home","Council Tax":"home","Energy":"home","Bills & subs":"home","Internet":"home","Money back":"annual","Home projects":"home",
  "Food shop":"food","Everyday spending":"spend","Nursery":"kids","Kids' savings":"kids","Household savings":"home",
  "Holidays":"trips","Parties & weddings":"trips","Annual payments":"annual",
  // Ben's NatWest account
  "Paid into joint account":"home","Savings & investing":"annual","Student loan & tax":"annual","Work & lunches":"spend","Eating out":"spend",
  "Personal spending":"spend","House & holiday (capex)":"trips","Other transfers":"annual","Shopping":"spend","Subscriptions & apps":"spend","Hobbies & leisure":"spend","Friends & social":"spend","Cash":"spend","Other":"spend","Travel":"trips"
};
const FAMLABEL = {home:"Home & bills",food:"Food",spend:"Everyday spending",kids:"Kids",trips:"Holidays & events",annual:"Annual payments"};

const BUILTIN_DATA = {source:'Nothing loaded yet', years:{}};

const NW_DATA = AD.nwData && AD.nwData.years ? AD.nwData : {source:'', labels:{}, subs:{}, years:{}, stmts:[]};   // NatWest statement periods (App data › nwData)

const NW_TXNS = Array.isArray(AD.nwTxns) ? AD.nwTxns : [];   // NatWest statement lines (NatWest transactions tab)

// Sprive top-ups (bought on Ben's card because Sprive wouldn't take the joint Santander card) are the
// joint account's food shop, and the joint account pays them straight back ("TOP UP ASDA" etc.).
// Net them off both sides so they don't show as personal food spend or as income.
// Things that don't add up get collected here and shown above the chart (see renderChecks).
// src: 'nw' | 'joint' | 'all'; year: the year it concerns, or null for every year.
const gbp2 = v => '£' + Math.abs(v).toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});
const CHECKS = [];
// Each statement's in/out totals are the truth. Where the itemised lines don't add up to them, the
// category totals still hold the missing amounts; add those back as un-itemised lines on the
// statement's last day so per-transaction views and calendar years match the statements.
(function itemiseGaps(){
  const MO = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
  const per = d => { const [y,m,dd] = d.split('-').map(Number), n = dd >= 14 ? m + 1 : m; return n > 12 ? `${y+1}-01` : `${y}-${String(n).padStart(2,'0')}`; };
  for(const z of NW_DATA.stmts){
    const rows = NW_TXNS.filter(t => per(t[0]) === z.key), out = rows.filter(t => t[1] < 0).reduce((a,t) => a - t[1], 0), inn = rows.filter(t => t[1] > 0).reduce((a,t) => a + t[1], 0);
    if(Math.abs(out - z.wd) < 0.005 && Math.abs(inn - z.pin) < 0.005) continue;
    const D = NW_DATA.years[z.key], have = {}; rows.filter(t => t[3] !== 'in').forEach(t => { const k = t[3]+'\u0001'+t[4]; have[k] = (have[k]||0) - t[1]; });
    const m = z.range.match(/(\d+)\s+([A-Z][a-z]{2})\s*$/), end = m ? `${z.key.slice(0,4)}-${String(MO[m[2]]).padStart(2,'0')}-${m[1].padStart(2,'0')}` : rows[rows.length-1][0];
    const added = [];
    for(const [c, items] of Object.entries(D.out)) for(const [i, v] of Object.entries(items)){
      const gap = +(v - (have[c+'\u0001'+i] || 0)).toFixed(2);
      if(gap > 0.005){ NW_TXNS.push([end, -gap, `Not itemised on the statement (${i}, ${z.range} total)`, c, i, 'gap']); added.push(`${i} ${gbp2(gap)}`); }
    }
  }
  NW_TXNS.sort((a,b) => a[0].localeCompare(b[0]));
})();
const SPRIVE_NET = {};   // per calendar year, Sprive spend the joint account paid back
(function netSprive(){
  const ITEM = 'ASDA (via Sprive)', BACK = 'Back from joint account';
  for(const [k, D] of Object.entries(NW_DATA.years)){ D._k = k;
    const food = D.out && D.out['Food shop'], spr = food && food[ITEM] || 0, back = D.income && D.income[BACK] || 0;
    const n = Math.min(spr, back);
    if(n > 0){
      if(/^\d{4}-\d\d$/.test(D._k || '')) SPRIVE_NET[D._k.slice(0,4)] = (SPRIVE_NET[D._k.slice(0,4)] || 0) + n;
      food[ITEM] = +(spr - n).toFixed(2); if(food[ITEM] < 0.005) delete food[ITEM];
      if(!Object.keys(food).length) delete D.out['Food shop'];
      D.income[BACK] = +(back - n).toFixed(2); if(D.income[BACK] < 0.005) delete D.income[BACK];
    }
    // What's left coming back is "TOP UP RETURN": cash Ben put into Santander to stop it going
    // overdrawn and then took back, so it cancels against his top-ups rather than counting as income.
    const jt = D.out && D.out['Paid into joint account'], rest = D.income && D.income[BACK] || 0, tu = jt && jt['Top-ups'] || 0;
    const m = Math.min(rest, tu); if(m <= 0) continue;
    jt['Top-ups'] = +(tu - m).toFixed(2); if(jt['Top-ups'] < 0.005) delete jt['Top-ups'];
    D.income[BACK] = +(rest - m).toFixed(2); if(D.income[BACK] < 0.005) delete D.income[BACK];
  }
  Object.values(NW_DATA.years).forEach(D => delete D._k);
  NW_TXNS.forEach(t => {
    if(/SPRIVE/i.test(t[2]) || t[4]===ITEM || (t[4]===BACK && /TOP UP (?!RETURN)/i.test(t[2]))){ t[3] = 'Covered by joint account'; t[4] = 'Sprive top-ups'; }
    else if(t[4]===BACK && /TOP UP RETURN/i.test(t[2])){ t[3] = 'Paid into joint account'; t[4] = 'Top-ups'; }   // shows as a refund on the top-ups
  });
})();
// Extra payments from MIRA ("Other pay (MIRA)") are expense claims paying Ben back for work costs
// he put on his own card. Each claim below lists the statement lines it covers (date, amount);
// both sides come out of the totals and the lines are grouped as "Expensed to MIRA".
// Unmatched claims stay as income until it's clear what they paid for.
const MIRA_CLAIMS = AD.miraClaims || [];   // App data › miraClaims: {label, credit:[date, amount], lines:[[date, amount, into?]]}
(function netClaims(){
  const per = d => { const [y,m,dd] = d.split('-').map(Number), n = dd >= 14 ? m + 1 : m; return n > 12 ? `${y+1}-01` : `${y}-${String(n).padStart(2,'0')}`; };
  const take = (D, t, into) => {   // remove one statement line from a period's totals
    if(!D) return;
    if(into){ const [c0, i0] = into.split('/'); t = [t[0], t[1], t[2], c0, i0]; }   // a refund already netted into a spend category
    if(t[3]==='in'){ const v = D.income[t[4]]; if(v == null) return; D.income[t[4]] = +(v - t[1]).toFixed(2); if(Math.abs(D.income[t[4]]) < 0.005) delete D.income[t[4]]; return; }
    const c = D.out[t[3]]; if(!c || c[t[4]] == null) return;
    // refunds were already netted into their category, so a positive line puts spend back
    c[t[4]] = +(c[t[4]] + t[1]).toFixed(2); if(Math.abs(c[t[4]]) < 0.005) delete c[t[4]];
    if(!Object.keys(c).length) delete D.out[t[3]];
  };
  for(const cl of MIRA_CLAIMS){
    const rows = [];
    const credit = NW_TXNS.find(t => t[0]===cl.credit[0] && Math.abs(t[1]-cl.credit[1]) < 0.005 && t[4]==='Other pay (MIRA)'); if(!credit) continue;
    const into = new Map();
    for(const [d, a, cat] of cl.lines){ const t = NW_TXNS.find(x => x[0]===d && Math.abs(x[1]-a) < 0.005 && x[3]!=='Expensed to MIRA' && !rows.includes(x)); if(t){ rows.push(t); if(cat) into.set(t, cat); } }
    const spent = -rows.reduce((s,t) => s + t[1], 0), covered = Math.min(spent, credit[1]);
    // the claim's spend leaves its categories; only what the claim covered leaves income
    rows.forEach(t => { take(NW_DATA.years[per(t[0])], t, into.get(t)); take(NW_DATA.years.ALL, t, into.get(t)); });
    for(const k of [per(credit[0]), 'ALL']){ const D = NW_DATA.years[k]; if(!D || D.income['Other pay (MIRA)'] == null) continue;
      D.income['Other pay (MIRA)'] = +(D.income['Other pay (MIRA)'] - covered).toFixed(2); if(D.income['Other pay (MIRA)'] < 0.005) delete D.income['Other pay (MIRA)']; }
    [...rows, credit].forEach(t => { t[3] = 'Expensed to MIRA'; t[4] = cl.label; });
    // anything the claim paid beyond the costs is just banked as other income
    const extra = +(credit[1] - covered).toFixed(2);
    if(extra > 0.005) for(const k of [per(credit[0]), 'ALL']){ const D = NW_DATA.years[k]; if(!D) continue;
      D.income['Other pay (MIRA)'] = +((D.income['Other pay (MIRA)']||0) - extra).toFixed(2); if(D.income['Other pay (MIRA)'] < 0.005) delete D.income['Other pay (MIRA)'];
      D.income['Other income'] = +((D.income['Other income']||0) + extra).toFixed(2); }
  }
  // MIRA payments that match no spending on the card: income nobody has explained yet
  NW_TXNS.forEach(t => { if(t[4]==='Other pay (MIRA)') t[4] = 'Unanswered income'; });
  for(const D of Object.values(NW_DATA.years)) if(D.income['Other pay (MIRA)'] != null){ D.income['Unanswered income'] = (D.income['Unanswered income']||0) + D.income['Other pay (MIRA)']; delete D.income['Other pay (MIRA)']; }
})();
// Items that get their own category on the joint account, whichever sheet section they sit in.
const REGROUP = [['Internet', /plusnet|now\s*tv|vodafone/i], ['Money back', /^emily('s)?\s+(car|glasses)|^money back/i]];
// Part of one item moved to another category: [year, from cat, item, amount, to cat, new item]. Skipped once the new item exists.
const SPLIT_ITEMS = [];   // none needed since v18 of the sheet carries Money back and SP Deryan itself
// Layer 3: an item's own breakdown, from the bank statements. Whatever the item holds beyond these shows as SUB_REST.
const SUB_REST = 'Not itemised yet';
// 2026 Misc, matched to the sheet's own sum cells (Jan 33 · Feb 4+10+20+7+17 · Mar 12+39+14+6 · Apr 30 · May 26+6+8+11+19+7+20+37+20 · Jun 26+31+30…)
const SUB_ITEMS = {};   // the Joint transactions tab gives each item's breakdown now
const SUB_NOTE = {};
// One-off corrections for a single year: [year, from category, item, to category, new item name].
const MOVE_ITEMS = [
  ['2022', 'Bills & subs', /^home ins/i, 'Annual payments', 'Home insurance'],
  ['2022', 'Bills & subs', /^sofa$/i, 'Home projects', 'Sofa']
];
const REGROUP_MOVED = {};   // 'Old cat›Item' → 'New cat›Item', for carrying over one-off choices
function regroupJoint(years){
  for(const [y, from, i, amt, toCat, as] of SPLIT_ITEMS){ const D = years && years[y], its = D && D.out && D.out[from];
    const id = [from, i, amt, toCat, as].join('|'); if(D && D.splitDone && D.splitDone[id]) continue;
    if(!its || typeof its !== 'object' || !(its[i] >= amt)) continue;
    const to = D.out[toCat] && typeof D.out[toCat] === 'object' ? D.out[toCat] : null;
    if(to && as in to && !D.splitDone && toCat === 'Money back') continue;   // saved before splitDone existed
    (D.out[toCat] = to || {})[as] = ((to && to[as]) || 0) + amt; its[i] = +(its[i] - amt).toFixed(2); if(!its[i]) delete its[i];
    (D.splitDone = D.splitDone || {})[id] = true; }
  for(const [y, from, re, toCat, as] of MOVE_ITEMS){ const D = years && years[y], its = D && D.out && D.out[from]; if(!its || typeof its !== 'object') continue;
    for(const i of Object.keys(its)){ if(!re.test(i)) continue;
      const to = (D.out[toCat] = D.out[toCat] && typeof D.out[toCat] === 'object' ? D.out[toCat] : (typeof D.out[toCat] === 'number' ? {[toCat]: D.out[toCat]} : {}));
      to[as] = (to[as] || 0) + its[i]; delete its[i];
      if(D.lumpy && D.lumpy[from+'›'+i] != null){ D.lumpy[toCat+'›'+as] = D.lumpy[from+'›'+i]; delete D.lumpy[from+'›'+i]; } }
    if(!Object.keys(its).length) delete D.out[from]; }
  for(const D of Object.values(years || {})){ if(!D || !D.out) continue;
    for(const [cat, re] of REGROUP) for(const c of Object.keys(D.out)){ const its = D.out[c]; if(c === cat || !its || typeof its !== 'object') continue;
      for(const i of Object.keys(its)){ if(!re.test(i)) continue;
        const to = (D.out[cat] = D.out[cat] && typeof D.out[cat] === 'object' ? D.out[cat] : {});
        to[i] = (to[i] || 0) + its[i]; delete its[i]; REGROUP_MOVED[c+'›'+i] = cat+'›'+i;
        if(D.lumpy && D.lumpy[c+'›'+i] != null){ D.lumpy[cat+'›'+i] = D.lumpy[c+'›'+i]; delete D.lumpy[c+'›'+i]; } }
      if(!Object.keys(its).length) delete D.out[c]; } }
  return years;
}
regroupJoint(BUILTIN_DATA.years);
// ── Joint account from the Santander statements ──
// The workbook's "Joint transactions" tab holds every Santander line (cleaned of names and numbers) with the
// sheet section and item it belongs to. It is read on this device only and kept in localStorage; nothing here is published.
const JTX_KEY = 'moneyflow.jtx.v1';
let JTX = null;      // [[date, amount (+ in, − out), description, category, item, how it was placed]]
let JCHECKS = [];    // "Worth checking" notes for the joint account
try{ const x = JSON.parse(localStorage.getItem(JTX_KEY)); if(Array.isArray(x) && x.length) JTX = x; }catch(e){}
// sheet section + item → [in|out, app category, app item], the same naming parseSantander uses
function jointPlace(sec, item){
  sec = String(sec||'').trim(); item = String(item||'').trim();
  if(sec === 'income'){
    if(/^(ben|emily)$/i.test(item)) return ['in', item[0].toUpperCase()+item.slice(1).toLowerCase(), null];
    if(/^(ben|emily) capex$/i.test(item)){ const w = item.split(' ')[0]; return ['in', w[0].toUpperCase()+w.slice(1).toLowerCase()+' (one-off)', null]; }
    if(item === 'Gov') return ['in', 'Child Benefit', null];
    if(/^loan/i.test(item)) return ['in', item, null];
    return ['in', 'Other income', null];
  }
  if(sec === 'Baseline') return ['out', BASE[item] || item, null];

function parseSantander(A){
  const str = v => v==null ? '' : String(v).trim();
  const num = v => typeof v === 'number' ? v : (isFinite(parseFloat(v)) ? parseFloat(v) : 0);

  // so take the candidate closest to "one year before the previous block" (the newest block takes its latest label).

    const pb = blocks[blocks.indexOf(b)-1];
    const useAnnual = filled < 10 && b-5 >= 0 && (pb==null || b-5 > pb+13) && mRow && num(mRow[b-5]) > 0;
    if(!useAnnual && lastM - filled > 2) continue; // a few stray months at the end of a year (e.g. an old part-year), not a usable year
    const val = r => useAnnual ? num(r[b-5]) : (()=>{ let s=0; for(let k=0;k<12;k++) s+=num(r[b+k]); return s; })();

    const lumpy = {};    // items whose spend lands in one or two months (see isOneOff)
    const BASE_CAT = {"Food":"Food shop","variable":"Everyday spending","Bills":"Bills & subs","Savings":"Kids' savings"};

      if(!lab) continue;

  }
  if(!Object.keys(years).length) throw new Error('No year blocks with figures were found.');

function build(d){

  const outTot = Object.values(d.out).reduce((a,v)=>a+total(v),0), hidden = d.hidden > 0 ? d.hidden : 0, outAll = outTot + hidden;
  const hub = node("Household pot", css("--paper-dim"), 1, {t:'hub'});
  const inColor = k => /top-ups/.test(k) ? css("--c-top") : css("--c-in");
  for (const [k,v] of Object.entries(d.income).sort((a,b)=>b[1]-a[1])) links.push({source:node(k,inColor(k),0,{t:'in',name:k}),target:hub,value:v,color:inColor(k)});

      for (const [k,val] of Object.entries(v).sort((a,b)=>b[1]-a[1])){

    [...labels].sort((a,b)=>b.n.value-a.n.value).forEach(L=>{

function valueIn(ref, d){
  if(!d) return null;
  const inT = Object.values(d.income).reduce((a,b)=>a+b,0) + (d.hiddenIn > 0 ? d.hiddenIn : 0), outT = Object.values(d.out).reduce((a,v)=>a+total(v),0) + (d.hidden > 0 ? d.hidden : 0);

  if(hasSub) named = [...named.filter(k => k !== SUB_REST), ...named.filter(k => k === SUB_REST)];
  const color = {}; named.filter(k => k !== MB_CAT && k !== SUB_REST).forEach((k,i) => color[k] = ITEM_COLORS[i] || ITEM_GREYS[i % ITEM_GREYS.length]);
  color['Other'] = css('--c-in'); color[MB_CAT] = MB_COLOR; color[SUB_REST] = css('--line');
  // A tapped item is pinned to the top of every year's stack, so its blocks share one baseline.
  if(hl && named.includes(hl) && ref.t !== 'hub') named = [hl, ...named.filter(k => k !== hl)];
  const order = [...named, 'Other'];
  rows.forEach(r => {
    const keep = r.parts.filter(p => named.includes(p.k)), rest = r.parts.filter(p => !named.includes(p.k));
    if(rest.length) keep.push({k:'Other', v:rest.reduce((s,p)=>s+p.v,0), a:rest.reduce((s,p)=>s+p.a,0), pro:rest.some(p=>p.pro), n:rest.length, items:rest.slice().sort((a,b)=>b.a-a.a)});
    r.parts = keep.sort((a,b)=>order.indexOf(a.k)-order.indexOf(b.k));
  });

  const canPick = ref.t==='cat' && !only;   // in a category view every item can be tapped to compare just that item
  // first tap pins the item to the top with everything else still drawn; tapping the pinned item again shows it alone
  const pickItem = k => openCompare({name:k, color:focusColor, ref:{t:'item', cat:ref.cat, item:k}, showAll: k !== hl}, year, fromYears);
  const sel = rows.find(r=>r.y===year);
  const maxA = Math.max(...rows.map(r=>Math.max(r.fa||0, r.parts.reduce((s,p)=>s+p.a,0))), 1);
  const maxParts = Math.max(...rows.map(r=>r.parts.length), 0);
  const GAP = 3, TOP = 6, BOT = 6;
  const s = (PH - TOP - BOT - Math.max(0,maxParts-1)*GAP) / maxA;   // £ → px, shared by every year

  let html = `<div class="cmp-grid" style="grid-template-columns:repeat(${rows.length},minmax(0,1fr))">`;
  rows.forEach((r, ri) => {
    const me = r.y===year, part = r.D.months < 12, ap = r.pro ? '≈' : '';
    // small ▲/▼ % per item against the year before (same pro-rating as the amounts)
    const prev = ri > 0 ? new Map(rows[ri-1].parts.flatMap(p => p.items ? [p, ...p.items] : [p]).map(p=>[p.k, p.a])) : null;
    const chg = p => {
      if(r.layer3 || (ri > 0 && rows[ri-1].layer3)) return '';
      if(!prev || p.k==='Other' || !rows[ri-1].focus) return '';
      const b = prev.get(p.k);
      if(!b) return `<span class="ch new">new</span>`;
      const pct = (p.a - b) / b * 100;
      if(Math.abs(pct) < 0.5) return `<span class="ch flat">0%</span>`;
      const good = isIncome ? pct > 0 : pct < 0;
      return `<span class="ch ${good?'good':'bad'}">${pct>0?'▲':'▼'}${Math.abs(pct).toFixed(0)}%</span>`;
    };
    const range = part ? `Jan–${MON[r.D.months-1]}` : '';
    const how = DATA.subs ? (DATA.subs[r.y]||'') : !part ? 'Full year' : !r.pro ? `${range} · one-off, as spent` : r.anyOne ? `${range} · ongoing ×${+(12/(r.D.span||r.D.months)).toFixed(1)}, one-offs as spent` : `${range} ×${+(12/(r.D.span||r.D.months)).toFixed(1)}`;
    const soFar = sel && sel.D.months < 12 && sel.anyOne ? ' so far' : '';
    let delta = '';
    if(!me && sel && sel.fa!=null && r.fa){
      const diff = sel.fa - r.fa, pct = diff/r.fa*100, good = isIncome ? diff>=0 : diff<=0;
      delta = Math.abs(diff) < 1 ? `Same as ${lab(year)}` : `<span class="${good?'good':'bad'}">${lab(year)}${soFar}: ${diff>0?'▲':'▼'}${gbp(Math.abs(diff))} (${diff>0?'+':'−'}${Math.abs(pct).toFixed(0)}%)</span>`;
    }
    html += `<section class="col${me?' me':''}">
      <div class="c-head"><span class="c-yr mono">${lab(r.y)}</span>${me?'<span class="c-now">viewing</span>':''}
        <span class="c-sub">${how}</span>
        <span class="c-amt mono">${r.focus ? ap+gbp(r.fa) : '—'}</span>
        ${part && r.focus && r.pro ? `<span class="c-sub">${gbp(r.focus)} so far</span>` : ''}
        ${r.mb ? `<span class="c-sub mb">−${gbp(r.mb)} back · ${ap}${gbp(r.fa - r.mb)} to use</span>` : ''}
        <span class="c-delta">${delta || '&nbsp;'}</span></div>
      <div class="c-body">
      ${r.focus ? `<svg class="c-svg" data-y="${r.y}" height="${Math.ceil(Math.max(r.fa, r.parts.reduce((a,p)=>a+p.a,0))*s + Math.max(0,r.parts.length-1)*GAP + TOP + BOT)}"></svg>` : `<div class="c-empty">Nothing in ${lab(r.y)}</div>`}
      <ul class="c-list">${r.parts.map((p, pi) => (ref.t==='hub' && !isNW() && (pi === 0 || grpOf(r.parts[pi-1].k) !== grpOf(p.k)) ? `<li class="grp">${['Regular','One-offs','From the balance','Back out'][grpOf(p.k)]}</li>` : '') + `<li data-k="${p.k.replace(/"/g,'&quot;')}" class="${p.k===hl?'hl':''}${canPick && p.k!=='Other' ? ' pick' : ''}"${canPick && p.k!=='Other' ? ` data-item="${p.k.replace(/"/g,'&quot;')}" tabindex="0" role="button"` : ''}><i style="background:${color[p.k]}"></i><span class="nm">${p.k}${p.n?` (${p.n})`:''}</span><span class="am mono">${p.neg?'−':''}${p.pro?'≈':''}${gbp(p.a)}${part && !p.pro && !p.neg ? ' so far' : ''} ${p.neg ? '' : chg(p)}</span></li>` + (p.items ? p.items.map(q => `<li class="sub${canPick ? ' pick' : ''}"${canPick ? ` data-item="${q.k.replace(/"/g,'&quot;')}" tabindex="0" role="button"` : ''}><i></i><span class="nm">${q.k}</span><span class="am mono">${q.neg?'−':''}${q.pro?'≈':''}${gbp(q.a)} ${q.neg ? '' : chg(q)}</span></li>`).join('') : '')).join('')
        || (r.focus && ref.t==='cat' && rows.some(q=>q.parts.length) ? `<li class="none">Not split into items in ${r.y}</li>` : '')}</ul>
      </div>
    </section>`;
  });
  html += `</div>`;
  document.getElementById('cmpTitle').textContent = only || title;
  document.querySelector('#cmp .eyebrow').textContent = `Layer ${only ? 3 : 2} · ` + (isStm() ? 'Month by month' : 'Year by year') + (only ? ` · ${ref.cat}` : '');
  const subEl = document.getElementById('cmpSub');
  subEl.textContent = (ref.t==='hub' && !isNW() ? `${hl ? hl + ' lit · ' : ''}raw money in, regular then one-offs; money back (striped) comes off before it’s used for joint things · ` : '') + (hasSub ? (SUB_NOTE[subKey] || '') + ' · ' : '') + (hl && !only && ref.t==='cat' ? `${hl} pinned to the top · tap it again to see it alone · ` : canPick ? 'Tap an item to pin it to the top · ' : '') + (isStm() ? 'every statement month drawn to the same scale' : 'all years drawn to the same scale') + (rows.some(r=>r.D.months<12) ? ' · part years: ongoing costs pro-rated to a full year (≈), one-off costs shown as spent so far' : '');
  if(only){ const b = document.createElement('button'); b.className = 'linkbtn'; b.textContent = `Show all ${ref.cat} items`; b.onclick = () => openCompare({...n, showAll:true}, year, fromYears); subEl.append(' · ', b); }
  if(hl && !only && ref.t==='cat'){ const b = document.createElement('button'); b.className = 'linkbtn'; b.textContent = 'Unpin'; b.onclick = () => openCompare({name:ref.cat, color:focusColor, ref:{t:'cat', cat:ref.cat}}, year, fromYears); subEl.append(' · ', b); }
  // yearly personal view: link through to the bank-statement breakdown of the pinned item (or the whole category)
  const stKey = !isStm() && (isNW() || (JTX && ref.t==='cat')) ? (hl || ref.cat) : null;
  const stJoint = !isNW() && stKey ? jointRows(ref.cat, hl) : null;
  if(stKey && (stJoint ? stJoint.length : stmtRows(stKey).length)){ const b = document.createElement('button'); b.className = 'linkbtn'; b.textContent = `Bank statement breakdown of ${stKey} ›`;
    b.onclick = () => openStatements(stKey, () => openCompare(n, year, fromYears), stJoint); subEl.append(' · ', b); }
  if(fromYears){ const b = document.createElement('button'); b.className = 'linkbtn'; b.textContent = '← All years'; b.onclick = () => openYears(yearsMode, year, yearsPin); subEl.prepend(b, ' · '); }
  fltLink(subEl, () => openCompare(n, year, fromYears));
  const body = document.getElementById('cmpBody'); body.innerHTML = html;
  const cmp = document.getElementById('cmp'); cmp.hidden = false; document.body.style.overflow = 'hidden'; cmp.scrollTop = 0;
  rows.forEach(r => { const el = body.querySelector(`svg[data-y="${r.y}"]`); if(!el) return;
    const done = drawPanel(el, r, {s, GAP, TOP, focusColor, color, hl, side: ref.t==='hub' ? 'left' : 'right', onItem: canPick ? pickItem : null});
    el.closest('.c-body').querySelectorAll('.c-list li[data-k]').forEach(li => { if(done.has(li.dataset.k) && li.dataset.k !== 'Other') li.hidden = true; });
    el.closest('.c-body').querySelectorAll('.c-list li.grp').forEach(g => { let n = g.nextElementSibling, any = false;   // drop a group heading whose items are all labelled on the chart
      while(n && !n.classList.contains('grp')){ if(!n.hidden) any = true; n = n.nextElementSibling; } g.hidden = !any; }); });
  if(canPick) body.querySelectorAll('.c-list li[data-item]').forEach(li => {
    li.onclick = () => pickItem(li.dataset.item);
    li.onkeydown = ev => { if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); pickItem(li.dataset.item); } };
  });
  if(isStm() && ref.t==='cat') addTxns(body, ref.cat, only);
  stmtPicker(body, () => openCompare(n, year, fromYears));
  document.getElementById('cmpX').focus({preventScroll:true});
}
// One-off or regular: every spending item for the account, with a Regular / One-off switch each.
// Regular items are scaled up to a full year in part years; one-offs count as spent.
function openOneOffs(year, back){
  const yrs = yearKeys(), Y = DATA.years[year] && DATA.years[year].months < 12 ? year : yrs[yrs.length-1], D = DATA.years[Y];
  const esc = x => String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  const items = {};   // cat -> {item -> {total over all years, this year}}
  for(const y of yrs) for(const [c, v] of Object.entries(DATA.years[y].out)){
    const its = typeof v === 'number' ? {'': v} : v;
    for(const [i, x] of Object.entries(its)){ if(!(x > 0)) continue; const o = ((items[c] = items[c] || {})[i] = items[c][i] || {all:0, now:0}); o.all += x; if(y === Y) o.now += x; } }
  const span = D.span || D.months, part = D.months < 12;
  const draw = () => {
    let reg = 0, one = 0;
    for(const [c, v] of Object.entries(D.out)){ const its = typeof v === 'number' ? {'': v} : v;
      for(const [i, x] of Object.entries(its)) if(x > 0){ if(isOneOff(D, c, i || null)) one += x; else reg += x; } }
    const regY = part ? reg * 12 / span : reg;
    const cats = Object.keys(items).sort((a,b) => Object.values(items[b]).reduce((s,o)=>s+o.all,0) - Object.values(items[a]).reduce((s,o)=>s+o.all,0));
    const body = document.getElementById('cmpBody');
    body.innerHTML = `<div class="oo-sum">
        <div><span class="k">Regular</span><b class="mono">${gbp(reg)}</b>${part ? `<span class="s">≈ ${gbp(regY)} for the full year</span>` : ''}</div>
        <div><span class="k">One-offs</span><b class="mono">${gbp(one)}</b><span class="s">counted as spent</span></div>
        <div><span class="k">${part ? 'Full year, projected' : 'Year total'}</span><b class="mono">${gbp(regY + one)}</b><span class="s">${part ? `regular ×${+(12/span).toFixed(2)} + one-offs` : lab(Y)}</span></div>
      </div>
      <p class="note" style="margin:4px 2px 10px">Amounts are ${lab(Y)}${part ? ' so far' : ''}. Your choice applies to every year. <span class="oo-auto-key">Auto</span> means the app guessed; tap to decide.</p>` +
      cats.map(c => { const its = Object.entries(items[c]).sort((a,b) => b[1].all - a[1].all);
        return `<section class="oo-cat"><h3><i style="background:${famColor(CATS[c]||'home')}"></i>${esc(c)}</h3><ul>` + its.map(([i, o]) => {
          const k = ovrKey(c, i || null), set = ONEOFF_SET[k], on = isOneOff(D, c, i || null);
          return `<li><span class="nm">${esc(i || c)}${set ? '' : ' <em class="oo-auto-key">Auto</em>'}</span><span class="am mono">${o.now ? gbp(o.now) : '–'}</span>
            <span class="seg2" role="group" aria-label="${esc(i || c)}"><button class="${on ? '' : 'on'}" data-k="${esc(k)}" data-v="reg" aria-pressed="${!on}">Regular</button><button class="${on ? 'on' : ''}" data-k="${esc(k)}" data-v="one" aria-pressed="${on}">One-off</button></span></li>`; }).join('') + `</ul></section>`; }).join('') +
      (Object.keys(ONEOFF_SET).some(k => k.startsWith((isNW() ? 'nw' : 'joint') + '|')) ? `<p style="margin:14px 2px"><button class="linkbtn" id="ooReset">Go back to the app’s guesses</button></p>` : '');
    body.querySelectorAll('.seg2 button').forEach(b => b.onclick = () => { ONEOFF_SET[b.dataset.k] = b.dataset.v; try{ localStorage.setItem(OVR_KEY, JSON.stringify(ONEOFF_SET)); }catch(e){}
      const st = document.getElementById('cmp').scrollTop; draw(); document.getElementById('cmp').scrollTop = st; render(); });
    const rs = document.getElementById('ooReset'); if(rs) rs.onclick = () => { const p = (isNW() ? 'nw' : 'joint') + '|'; Object.keys(ONEOFF_SET).forEach(k => { if(k.startsWith(p)) delete ONEOFF_SET[k]; });
      try{ localStorage.setItem(OVR_KEY, JSON.stringify(ONEOFF_SET)); }catch(e){} draw(); render(); };
  };
  document.getElementById('cmpTitle').textContent = 'One-off or regular';
  document.querySelector('#cmp .eyebrow').textContent = isNW() ? 'Your NatWest spending' : 'Joint account spending';
  const subEl = document.getElementById('cmpSub'); subEl.textContent = 'Regular costs are scaled up to a full year when a year isn’t finished; one-offs aren’t.';
  if(back){ const b = document.createElement('button'); b.className = 'linkbtn'; b.textContent = '← Back'; b.onclick = back; subEl.prepend(b, ' · '); }
  draw();
  const cmp = document.getElementById('cmp'); cmp.hidden = false; document.body.style.overflow = 'hidden'; cmp.scrollTop = 0;
}

// ── Payslip check ─────────────────────────────────────────────────────────
// Lines follow the "Salary" block on the Full Summary sheet. Amounts are typed as
// positive numbers; s says which way they count. BIK is taxable but never paid.
const PAY_KEY = 'moneyflow.payslips.v1';
const PAY_LINES = [
  {k:'basic',    n:'Monthly salary',   g:'Pay',               s: 1, d:0},
  {k:'bonus',    n:'Bonuses',          g:'Pay',               s: 1, d:0},
  {k:'otherPay', n:'Other pay',        g:'Pay',               s: 1, d:0,   h:'back pay, overtime, anything else paid'},
  {k:'holiday',  n:'Holiday buy',      g:'Salary sacrifice',  s:-1, d:0},
  {k:'pension',  n:'Pension',          g:'Salary sacrifice',  s:-1, d:0},
  {k:'car',      n:'Car',              g:'Salary sacrifice',  s:-1, d:0},
  {k:'bik',      n:'BIK',              g:'Taxable benefit',   s: 0, d:0, h:'adds to taxable pay, not to what you get'},
  {k:'tax',      n:'Tax',              g:'Deductions',        s:-1, d:0},
  {k:'ni',       n:'NI',               g:'Deductions',        s:-1, d:0},
  {k:'student',  n:'Student loan',     g:'Deductions',        s:-1, d:0},
  {k:'ssc',      n:'SSC500',           g:'Deductions',        s:-1, d:0},
  {k:'otherDed', n:'Other deductions', g:'Deductions',        s:-1, d:0}
];
PAY_LINES.forEach(l => { const v = (AD.payDefaults || {})[l.k]; if(typeof v === 'number') l.d = v; });   // App data › payDefaults
let PAYSLIPS = {}; try{ PAYSLIPS = JSON.parse(localStorage.getItem(PAY_KEY) || '{}') || {}; }catch(e){ PAYSLIPS = {}; }
const savePayslips = () => { try{ localStorage.setItem(PAY_KEY, JSON.stringify(PAYSLIPS)); return true; }catch(e){ toast('Couldn’t save on this device: ' + e.message); return false; } };
let payLater = false;   // "Later" hides the ask until the app is next opened
const payCalc = v => {
  const g = x => +v[x] || 0;
  const pay = g('basic') + g('bonus') + g('otherPay'), sac = g('holiday') + g('pension') + g('car');
  const gross = pay - sac, ded = g('tax') + g('ni') + g('student') + g('ssc') + g('otherDed');
  return {pay, sac, gross, taxable: gross + g('bik'), ded, net: +(gross - ded).toFixed(2)};
};
const PAY_CREDITS = (() => { const o = {};   // month → {amt, date} of the HORIBA MIRA salary credit on the statements
  NW_TXNS.forEach(t => { if(t[3] === 'in' && t[4] === 'Salary'){ const m = t[0].slice(0,7); o[m] = o[m] || {amt:0, date:t[0]}; o[m].amt = +(o[m].amt + t[1]).toFixed(2); } });
  return o; })();
function payMonths(){   // every pay month from the first statement salary to the latest one that's due (paid around the 15th)
  const ks = Object.keys(PAY_CREDITS).sort(); if(!ks.length) return [];
  const first = [ks[0], ...Object.keys(PAYSLIPS)].sort()[0];
  const now = new Date(), last = now.getDate() >= 15 ? now : new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const end = `${last.getFullYear()}-${String(last.getMonth()+1).padStart(2,'0')}`, out = [];
  let [y, m] = first.split('-').map(Number);
  for(let i = 0; i < 240; i++){ const k = `${y}-${String(m).padStart(2,'0')}`; out.push(k); if(k >= end && k >= ks[ks.length-1]) break; m++; if(m > 12){ m = 1; y++; } }
  return out;
}
const payRecv = m => PAY_CREDITS[m] ? PAY_CREDITS[m].amt : (PAYSLIPS[m] && typeof PAYSLIPS[m].recv === 'number' ? PAYSLIPS[m].recv : null);
const payGap = m => { const r = payRecv(m), p = PAYSLIPS[m]; return p && r !== null ? +(r - payCalc(p.v).net).toFixed(2) : null; };
function payPrefill(m){   // the confirmed month before, else the sheet's figures
  const prev = Object.keys(PAYSLIPS).filter(k => k < m && PAYSLIPS[k].v).sort().pop();
  if(prev) return {v: Object.assign({}, PAYSLIPS[prev].v), from: mLabel(prev)};
  const v = {}; PAY_LINES.forEach(l => v[l.k] = l.d); return {v, from: 'your sheet'};
}
function payChecks(year){   // mismatches for the "Worth checking" list on Ben's tab
  return Object.keys(PAYSLIPS).sort().filter(m => { const gp = payGap(m); if(PAYSLIPS[m].src === 'sheet' || gp === null || Math.abs(gp) < 0.005) return false;
    if(!year || year === 'ALL') return true; if(year.length === 4) return m.slice(0,4) === year;
    const [y, mm] = m.split('-').map(Number), st = mm === 12 ? `${y+1}-01` : `${y}-${String(mm+1).padStart(2,'0')}`; return st === year; })
    .map(m => { const gp = payGap(m); return {src:'nw', text:`${mLabel(m)} payslip: net pay ${gbp2(payCalc(PAYSLIPS[m].v).net)} but ${gbp2(payRecv(m))} landed in NatWest (${gp > 0 ? 'more' : 'less'} by ${gbp2(gp)}).`}; });
}
function renderPayReq(){
  const el = document.getElementById('payReq'), ms = payMonths(), m = ms[ms.length-1];
  if(!m || (PAYSLIPS[m] && PAYSLIPS[m].src !== 'sheet') || payLater){ el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<p><b>Payslip check · ${mLabel(m)}</b><br>Confirm this month’s payslip lines so your pay can be broken down.</p>
    <div class="btns"><button class="btn primary" id="payGo">Check now</button><button class="btn" id="payLater">Later</button></div>`;
  document.getElementById('payGo').onclick = () => openPayslip(m, openPayslips);
  document.getElementById('payLater').onclick = () => { payLater = true; renderPayReq(); };
}
const PAY_SEGS = [['Take-home', '--c-left', c => c.net], ['Tax', '--c-gap', (c,v) => +v.tax||0], ['NI', '--c-food', (c,v) => +v.ni||0],
  ['Pension', '--c-annual', (c,v) => +v.pension||0], ['Student loan', '--c-trips', (c,v) => +v.student||0],
  ['Other', '--c-in', (c,v) => (+v.holiday||0) + (+v.car||0) + (+v.ssc||0) + (+v.otherDed||0)]];
function payChart(ms){
  const W = 340, L = 54, R = 52, rh = 20, H = ms.length * rh + 4, max = Math.max(...ms.map(m => payCalc(PAYSLIPS[m].v).pay), 1), sc = (W - L - R) / max;
  const rows = ms.map((m, i) => { const v = PAYSLIPS[m].v, c = payCalc(v); let x = L;
    const segs = PAY_SEGS.map(([n, col, f]) => { const w = Math.max(0, f(c, v)) * sc, r = w > 0 ? `<rect x="${x.toFixed(1)}" y="${i*rh+3}" width="${w.toFixed(1)}" height="${rh-6}" fill="${css(col)}"><title>${n} ${gbp2(f(c, v))}</title></rect>` : ''; x += w; return r; }).join('');
    return `<text x="0" y="${i*rh+rh/2+4}">${mLabel(m).replace(' 20',' ’')}</text>${segs}<text x="${W}" y="${i*rh+rh/2+4}" text-anchor="end">${gbp(c.net)}</text>`; }).join('');
  return `<svg class="ps-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pay each month split into take-home and deductions">${rows}</svg>
    <div class="ps-key">${PAY_SEGS.map(([n, col]) => `<span><i style="background:${css(col)}"></i>${n}</span>`).join('')}</div>`;
}
function payOpenShell(eyebrow, title, sub){
  document.querySelector('#cmp .eyebrow').textContent = eyebrow;
  document.getElementById('cmpTitle').textContent = title;
  document.getElementById('cmpSub').textContent = sub;
  const cmp = document.getElementById('cmp'); cmp.hidden = false; document.body.style.overflow = 'hidden'; cmp.scrollTop = 0;
  return document.getElementById('cmpBody');
}
function openPayslips(){   // go to the Payslips pill (also the "back" from a month's form)

// ── Rest of year: the cash the joint account needs from the last statement to 31 Dec ──
// Baseline = the year's regular spending per month (complete months only). Extras = one-off items the
// past years' statements show in the same months (Christmas, annual payments…) that haven't been paid
// this year, plus anything added by hand (e.g. a holiday deposit). Money in is typed per month.
// Choices live in prefs.roy; "Lock plan" keeps a copy so later statements are tracked against it.
const ROY_DEF = {inc:null, xmas:1000, extras:[{n:'Holiday deposit', a:1000, m:12}], pick:{}, amt:{}, plan:null};

  const monthEnd = new Date(Y, lm, 0).getDate(), done = lastDay >= monthEnd - 1;   // the last statement month counts as complete near its end

    body.querySelectorAll('[data-xa]').forEach(i => i.onchange = () => { R.extras[+i.dataset.xa].a = +i.value || 0; keep(); });
    body.querySelectorAll('[data-xd]').forEach(b => b.onclick = () => { R.extras.splice(+b.dataset.xd, 1); keep(); });
    document.getElementById('royAdd').onclick = () => { R.extras.push({n:'New cost', a:0, m:M.months[M.months.length-1]}); keep(); };
    document.getElementById('royLock').onclick = () => {
      if(M.locked) R.plan = null;
      else R.plan = {y: M.Y, made: new Date().toLocaleDateString('en-GB', {day:'numeric', month:'short'}), months: M.live};
      keep(); };
    body.querySelectorAll('input,select,[data-xd],#royAdd').forEach(el => el.disabled = M.locked);
  };
  document.getElementById('cmpTitle').textContent = 'Rest of the year';
  document.querySelector('#cmp .eyebrow').textContent = 'Joint account · cash needed to 31 Dec';
  document.getElementById('cmpSub').textContent = 'Normal monthly spending, plus the extras past years show at this time of year.';
  draw();
  cmp.hidden = false; document.body.style.overflow = 'hidden'; cmp.scrollTop = 0;
}
document.getElementById('royBtn').onclick = () => openRestOfYear();

// ── page ──
function render(){
  if(isStm() && !NW_DATA.stmts.length) prefs.nwView = 'years';
  applySrc();
  const flow = isFlow();
  renderPayReq();
  document.getElementById('payView').hidden = prefs.src !== 'pay';
  document.querySelector('main > .bar').hidden = prefs.src === 'pay';
  document.getElementById('oneOffBtn').hidden = !flow;
  document.getElementById('royBtn').hidden = !(prefs.src === 'joint' && JTX && JTX.length);
  document.getElementById('flowView').hidden = !flow;
  document.getElementById('worthView').hidden = prefs.src !== 'worth';
  document.getElementById('assetsView').hidden = prefs.src !== 'assets';
  document.getElementById('yearsBtn').hidden = !flow;
  document.getElementById('zoomHint').hidden = !flow;
  document.getElementById('yearTabs').hidden = !flow;
  const tabs = [['joint','Joint account'],['nw','Ben’s cash flow'],['pay','Payslips'],['worth','Net worth'],['assets','Assets']];
  document.getElementById('srcTabs').innerHTML = tabs.map(([k,t])=>`<button class="src-tab${prefs.src===k?' active':''}" data-s="${k}">${t}</button>`).join('');
  document.querySelectorAll('.src-tab').forEach(b=>b.onclick=()=>{ if(prefs.src===b.dataset.s) return; prefs.src=b.dataset.s; if(prefs.year==='ALL') prefs.year=null; savePrefs(); setTimeout(render,0); });
  const vt = document.getElementById('viewTabs'), hasStm = NW_DATA.stmts.length > 0; vt.hidden = !isNW() || !hasStm;
  vt.innerHTML = isNW() && hasStm ? [['years','By year'],['stmts','By statement']].map(([k,t])=>`<button class="sub-tab${prefs.nwView===k?' active':''}" data-v="${k}">${t}</button>`).join('') : '';
  vt.querySelectorAll('.sub-tab').forEach(b=>b.onclick=()=>{ prefs.nwView=b.dataset.v; prefs.year=null; savePrefs(); setTimeout(render,0); });
  document.querySelector('.top .eyebrow').textContent = ({joint:'Joint account · where it all went', nw:'Ben’s NatWest · personal account', pay:'Ben’s pay · payslips checked against NatWest', worth:'Net worth · cash, savings and investments', assets:'Every account, savings pot and investment'})[prefs.src] || '';
  document.getElementById('resetBtn').hidden = !(usingImport || usingExtra || NW_TXNS.length || JTX);
  // nothing loaded for this tab yet: say what to do instead of drawing an empty chart
  const empty = prefs.src === 'joint' ? !Object.keys(JOINT.years || {}).length
    : prefs.src === 'nw' ? !Object.keys(NWY_DATA.years || {}).length && !NW_DATA.stmts.length
    : prefs.src === 'pay' ? !Object.keys(PAYSLIPS).length && !Object.keys(PAY_CREDITS).length
    : !usingExtra;
  const ev = document.getElementById('emptyView'); ev.hidden = !empty;
  if(empty){
    ['flowView','payView','worthView','assetsView','yearTabs','yearsBtn','oneOffBtn','royBtn','zoomHint'].forEach(id => document.getElementById(id).hidden = true);
    document.getElementById('legend').innerHTML = '';
    const need = {joint:'the Santander sheet (and the Joint transactions tab)', nw:'the Full Summary sheet and the NatWest transactions tab', pay:'the Full Summary sheet’s Salary block', worth:'the Full Summary sheet', assets:'the Full Summary sheet'}[prefs.src] || 'the workbook';
    ev.innerHTML = `<h2>Load your finances workbook</h2><p>Nothing is built into the app any more, so every figure comes from your “2026 finances” workbook. This tab reads ${need}.</p><p>Tap <b>Load spreadsheet</b> and pick the latest version. It stays on this phone only.</p>`;
    return;
  }
  if(!flow){ document.getElementById('legend').innerHTML = ''; if(prefs.src === 'worth') renderWorth(); else if(prefs.src === 'pay') renderPayslips(); else renderAssets(); return; }
  const yrs = Object.keys(DATA.years).sort();
  if(!prefs.year || !DATA.years[prefs.year]) prefs.year = isStm() ? 'ALL' : (yrs.find(y=>DATA.years[y].months>=12 && y===String(new Date().getFullYear()-1)) || yrs[yrs.length-1]);
  document.getElementById('yearsBtn').textContent = isStm() ? 'Compare months' : 'Compare all years';
  document.getElementById('oneOffBtn').hidden = isStm();
  document.getElementById('yearTabs').classList.toggle('many', yrs.length > 6);
  const year = prefs.year, d = DATA.years[year];
    document.getElementById('src').textContent = DATA.source + '.';
  document.getElementById('yearTabs').innerHTML = yrs.map(y=>{
    const m = DATA.years[y].months;
    return `<button class="yr-tab${y===year?' active':''}" role="tab" aria-selected="${y===year}" data-y="${y}">${lab(y)}<span class="sub">${DATA.subs ? DATA.subs[y] : m>=12?'full year':'Jan–'+MON[m-1]}</span></button>`;
  }).join('');
  document.querySelectorAll('.yr-tab').forEach(b=>b.onclick=()=>{ prefs.year=b.dataset.y; savePrefs(); setTimeout(render,0); });

  const g = build(d), net = g.inTot + g.hiddenIn - g.outTot - g.hidden, mort = total(d.out.Mortgage || 0);
  document.getElementById("stats").innerHTML = `
    <div class="stat"><span class="k">Money in</span><span class="v">${gbp(g.inTot)}</span><span class="s">${g.hiddenIn > 0 ? `shown · ${gbp(g.hiddenIn)} filtered out · ` : ''}${DATA.subs ? DATA.subs[year] : yearLabel(year,d.months)}${d.mbTotal > 0 ? ` · after ${gbp(d.mbTotal)} money back` : ''}</span></div>
    <div class="stat"><span class="k">Money out</span><span class="v">${gbp(g.outTot)}</span><span class="s">${g.hidden > 0 ? `shown · ${gbp(g.hidden)} filtered out` : isNW() ? Math.round(total(d.out['Paid into joint account']||0)/g.outTot*100)+'% paid into the joint account' : Math.round(mort/g.outTot*100)+'% on the mortgage'}</span></div>
    <div class="stat"><span class="k">Net</span><span class="v ${net<0?'neg':'pos'}">${net<0?'−':'+'}${gbp(Math.abs(net))}</span><span class="s">${net<0?'Spent more than came in':'Left in the account'}</span></div>`;
  let nt = d.note || '';
  if(d.mbTotal > 0) nt = (nt ? nt + ' ' : '') + `Money in is net of ${gbp(d.mbTotal)} money back (${Object.keys(d.moneyBack).join(', ')}), taken off the one-off payments. Tap the pot to see it gross.`;
  if(!isStm() && isNW() && !nt){ const pm = y => total(DATA.years[y].income)/Math.max(DATA.years[y].months,1), others = Object.keys(DATA.years).filter(y=>y!==year).map(pm).sort((a,b)=>a-b);
    if(others.length >= 2 && pm(year) > 1.8*others[Math.floor(others.length/2)]) nt = 'Income looks high for this year (about '+gbp(pm(year))+' a month against '+gbp(others[Math.floor(others.length/2)])+' in other years). The sheet probably counts transfers between your own accounts as income, so treat the net figure with care.'; }
  if(d.fromStatements) nt = d.note;
  if(d.paired && d.paired.length) nt = (nt ? nt + ' ' : '') + d.paired.map(p => `${gbp(p.amt)} of ${p.what.join(', ')} and the ${p.by} money that paid for it are left out.`).join(' ');
  document.getElementById("note").textContent = nt;
  renderChecks(year);
  renderFltBar();
  drawChart(d, year);

  const fams = [...new Set(Object.keys(d.out).map(k=>CATS[k]||'home'))];
  document.getElementById("legend").innerHTML =
    `<span><i style="background:${css('--c-in')}"></i>Income</span>` +
    (Object.keys(d.income).some(k=>/top-ups/.test(k)) ? `<span><i style="background:${css('--c-top')}"></i>Top-ups</span>` : '') +
    fams.map(f=>`<span><i style="background:${famColor(f)}"></i>${FAMLABEL[f]}</span>`).join("") +
    (net<0?`<span><i style="background:${css('--c-gap')}"></i>Drawn from balance</span>`:`<span><i style="background:${css('--c-left')}"></i>Left over</span>`);
  renderTable(d, g, year);
  renderTie();
}

function renderChecks(year){
  const el = document.getElementById('checks'), src = isNW() ? 'nw' : prefs.src === 'joint' ? 'joint' : null;
  const list = (src ? CHECKS.concat(JCHECKS).filter(c => (c.src === src || c.src === 'all') && (!c.year || c.year === year || (isStm() && c.src === 'nw'))) : []).concat(src === 'nw' ? payChecks(year) : []);
  el.hidden = !list.length;
  el.innerHTML = list.length ? `<li class="ck-h">Worth checking</li>` + list.map(c => `<li>${c.text.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</li>`).join('') : '';
}
function renderTie(){
  const el = document.getElementById('tie');
  if(!isStm()){ el.hidden = true; return; }
  const f2 = v => '£' + v.toLocaleString('en-GB',{minimumFractionDigits:2, maximumFractionDigits:2});
  const rows = NW_DATA.stmts.map(z => {
    const bad = Math.abs(z.missing) >= 0.005;
    return `<tr><td>${z.range}</td><td>${f2(z.open)}</td><td>${f2(z.pin)}</td><td>${f2(z.wd)}</td><td>${f2(z.close)}</td><td class="${bad?'warn':'ok'}">${bad ? '⚠ '+f2(z.missing)+' short' : '✓ ties'}</td></tr>`;
  }).join('');
  const sheet = AD.nwSheetTie || [], tieNote = AD.nwTieNote ? ' ' + AD.nwTieNote : '';   // App data › nwSheetTie: [month, sheet, statement, result]
  el.hidden = false;
  el.innerHTML = `<h2>Ties to the statements</h2>
    <p class="tie-note">Each statement’s opening, paid in, withdrawn and closing figures, checked against the transactions read from it. Refunds are netted in the breakdown, so category totals differ slightly from the bank’s paid-in and withdrawn.${tieNote}</p>
    <div class="tbl-wrap"><table><thead><tr><th>Statement</th><th>Opening</th><th>Paid in</th><th>Withdrawn</th><th>Closing</th><th>Check</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${sheet.length ? `<h2 style="margin-top:16px">Your sheet’s NatWest line</h2>
    <p class="tie-note">The “Full Summary” row for the Select account, against the statement balance for that month-end.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Month</th><th>Sheet</th><th>Statement</th><th>Result</th></tr></thead><tbody>${sheet.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>` : ''}`;
}
const openCats = new Set();
function renderTable(d, g, year){
  let h = `<thead><tr><th>Category</th><th>Amount</th><th>Per month</th><th>% of in</th></tr></thead><tbody>`;
  for (const [cat,v] of Object.entries(d.out).sort((a,b)=>total(b[1])-total(a[1]))){
    const t = total(v), multi = typeof v === "object", open = openCats.has(cat);
    h += `<tr class="row" data-cat="${cat}"><td>${multi?`<button class="chev" data-toggle="${cat}" aria-expanded="${open}" aria-label="Show items">${open?'▾':'▸'}</button>`:'<span class="chev-sp"></span>'}<span class="sw" style="background:${famColor(CATS[cat]||'home')}"></span>${cat}</td><td>${gbp(t)}</td><td>${gbp(t/(d.div||d.months))}</td><td>${(t/g.inTot*100).toFixed(1)}%</td></tr>`;
    if (multi && open) for (const [k,val] of Object.entries(v).sort((a,b)=>b[1]-a[1]))
      h += `<tr class="row sub" data-cat="${cat}" data-item="${k}"><td>${k}</td><td>${gbp(val)}</td><td>${gbp(val/(d.div||d.months))}</td><td>${(val/g.inTot*100).toFixed(1)}%</td></tr>`;
  }
  h += `</tbody><tfoot><tr><td>Total out</td><td>${gbp(g.outTot)}</td><td>${gbp(g.outTot/(d.div||d.months))}</td><td>${(g.outTot/g.inTot*100).toFixed(1)}%</td></tr></tfoot>`;
  const tbl = document.getElementById("tbl"); tbl.innerHTML = h;
  tbl.querySelectorAll('tr.row').forEach(r=>r.onclick=ev=>{
    const tg = ev.target.closest('[data-toggle]');
    if(tg){ const c = tg.dataset.toggle; openCats.has(c)?openCats.delete(c):openCats.add(c); setTimeout(()=>renderTable(d,g,year),0); return; }
    const cat = r.dataset.cat, item = r.dataset.item, color = famColor(CATS[cat]||'home');
    openCompare(item ? {name:item, color, ref:{t:'item',cat,item}} : {name:cat, color, ref:{t:'cat',cat}}, year);
  });
}

let rt, lastW = window.innerWidth; window.addEventListener("resize",()=>{ if(window.innerWidth===lastW) return; lastW=window.innerWidth; clearTimeout(rt); rt=setTimeout(render,150); });
document.getElementById('versionBadge').textContent = `v${APP_VERSION}`;
render();
try{ const m = sessionStorage.getItem('moneyflow.toast'); if(m){ sessionStorage.removeItem('moneyflow.toast'); toast(m); } }catch(e){}
</script>
